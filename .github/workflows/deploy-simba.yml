name: Deploy Simba to VPS

on:
  push:
    branches:
      - deploy/simba

permissions:
  contents: read

concurrency:
  group: deploy-simba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SVC_CDEK_CLIENT_ID: ${{ secrets.CDEK_CLIENT_ID }}
          SVC_CDEK_CLIENT_SECRET: ${{ secrets.CDEK_CLIENT_SECRET }}
          SVC_YANDEX_DELIVERY_TOKEN: ${{ secrets.YANDEX_DELIVERY_TOKEN }}
          SVC_YANDEX_PVZ_SOURCE_STATION: ${{ secrets.YANDEX_PVZ_SOURCE_STATION }}
          SVC_DADATA_TOKEN: ${{ secrets.DADATA_TOKEN }}
          SVC_OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          SVC_OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          SVC_MOYSKLAD_TOKEN: ${{ secrets.MOYSKLAD_TOKEN }}
        with:
          host: ${{ secrets.SIMBA_DEPLOY_HOST }}
          username: ${{ secrets.SIMBA_DEPLOY_USER }}
          key: ${{ secrets.SIMBA_DEPLOY_SSH_KEY }}
          command_timeout: 15m
          # Ключи служб живут в секретах GitHub и переносятся в server/.env на
          # сервере этим же шагом (см. "Syncing service keys" ниже). Значения в
          # лог не попадают — только «задан/пусто».
          envs: SVC_CDEK_CLIENT_ID,SVC_CDEK_CLIENT_SECRET,SVC_YANDEX_DELIVERY_TOKEN,SVC_YANDEX_PVZ_SOURCE_STATION,SVC_DADATA_TOKEN,SVC_OZON_CLIENT_ID,SVC_OZON_API_KEY,SVC_MOYSKLAD_TOKEN
          script: |
            set -euo pipefail
            cd /var/www/simba-src

            echo "==> Syncing service keys from GitHub secrets into server/.env"
            touch server/.env
            upsert_env() {
              local key="$1" value="$2"
              if [ -z "$value" ]; then echo "   $key: empty in secrets, left as is"; return; fi
              local escaped
              escaped=$(printf '%s' "$value" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
              if grep -q "^${key}=" server/.env; then
                sed -i "s|^${key}=.*|${key}=\"${escaped}\"|" server/.env
              else
                printf '%s="%s"\n' "$key" "$escaped" >> server/.env
              fi
              echo "   $key: set"
            }
            upsert_env CDEK_CLIENT_ID "$SVC_CDEK_CLIENT_ID"
            upsert_env CDEK_CLIENT_SECRET "$SVC_CDEK_CLIENT_SECRET"
            if [ -n "$SVC_CDEK_CLIENT_ID" ]; then upsert_env CDEK_SANDBOX "false"; fi
            upsert_env YANDEX_DELIVERY_TOKEN "$SVC_YANDEX_DELIVERY_TOKEN"
            upsert_env YANDEX_PVZ_SOURCE_STATION "$SVC_YANDEX_PVZ_SOURCE_STATION"
            upsert_env DADATA_TOKEN "$SVC_DADATA_TOKEN"
            upsert_env OZON_CLIENT_ID "$SVC_OZON_CLIENT_ID"
            upsert_env OZON_API_KEY "$SVC_OZON_API_KEY"
            upsert_env MOYSKLAD_TOKEN "$SVC_MOYSKLAD_TOKEN"

            echo "==> Fetching deploy/simba"
            git fetch origin deploy/simba
            git checkout deploy/simba
            git merge --ff-only origin/deploy/simba

            echo "==> Installing dependencies"
            npm install

            echo "==> Generating Prisma client"
            (cd server && npx prisma generate)

            echo "==> Backing up database before any migration"
            BACKUP_FILE="/tmp/simba_backup_$(date +%Y%m%d_%H%M%S).dump"
            docker exec deploy-postgres-1 pg_dump -U simba -d simba -F c -f "$BACKUP_FILE"
            docker exec deploy-postgres-1 test -s "$BACKUP_FILE"
            echo "Backup OK: $BACKUP_FILE"

            echo "==> Building server, client, admin"
            npm run build --workspace=server
            # Ключ карт приходит из секретов репозитория, а не вписан здесь:
            # VITE_* попадает в собранный код страницы, и адрес API мы держим
            # открытым осознанно, а ключ Яндекса — нет. Пока секрет не заведён,
            # значение пустое, и карта с подсказками просто не показывается.
            # Ключ виден в коде страницы — это нормально для JS API, но в
            # кабинете разработчика Яндекса его нужно ограничить по HTTP-referer
            # (сейчас — IP сервера, после переезда — simbazoo.ru), иначе его
            # уведут со страницы и потратят чужую квоту.
            VITE_API_URL=http://147.45.157.11 \
              VITE_YANDEX_MAPS_KEY='${{ secrets.YANDEX_MAPS_KEY }}' \
              npm run build --workspace=client
            VITE_API_URL=http://147.45.157.11 npm run build --workspace=admin

            echo "==> Applying migrations (old code keeps running on the new schema until reload: only additive migrations are safe here)"
            (cd server && npx prisma migrate deploy)

            echo "==> Backfilling data the code expects (idempotent, admin edits win)"
            (cd server && npx tsx src/scripts/backfill-quiz-tags.ts --apply)
            (cd server && npx tsx src/scripts/backfill-categories.ts --apply)
            (cd server && npx tsx src/scripts/backfill-brand-identity.ts --apply)
            (cd server && npx tsx src/scripts/backfill-banners.ts --apply)
            (cd server && npx tsx src/scripts/backfill-species.ts --apply --only-unknown)
            (cd server && npx tsx src/scripts/backfill-brand-logos.ts --apply)
            (cd server && npx tsx src/scripts/seed-promo-codes.ts --apply)
            (cd server && npx tsx src/scripts/import-blog.ts)

            echo "==> МойСклад token probe (statuses only, no values)"
            (cd server && npx tsx src/scripts/moysklad-probe.ts || true)
            echo "==> Product photos from МойСклад: quick probe (dry run, 3 products) so the outcome is visible here"
            (cd server && npx tsx src/scripts/sync-photos.ts --limit 3 || true)
            echo "==> Product photos from МойСклад: full pass in the background (log: sync-photos.log)"
            (cd server && setsid nohup npx tsx src/scripts/sync-photos.ts --apply > /var/www/simba-src/sync-photos.log 2>&1 < /dev/null &)

            pm2 reload simba-server --update-env

            echo "==> Deploying static files"
            mkdir -p /var/www/simba/client /var/www/simba/admin
            rm -rf /var/www/simba/client/* /var/www/simba/admin/*
            cp -r client/dist/* /var/www/simba/client/
            cp -r admin/dist/*  /var/www/simba/admin/

            echo "==> Health check"
            sleep 2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/products/list)
            if [ "$STATUS" != "200" ]; then
              echo "Health check FAILED: HTTP $STATUS"
              pm2 logs simba-server --lines 40 --nostream --err
              exit 1
            fi
            echo "Health check OK: HTTP $STATUS"
            echo "==> Deploy complete"
