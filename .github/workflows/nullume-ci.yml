name: Nullume CI

# Проверка пакета tools/nullume при изменениях в нём:
# типы, тесты, сборка, упаковка (dry-run).

# Ветки выкатки исключены намеренно. Фильтр по путям без фильтра по веткам
# запускал этот прогон и на пуше в deploy/simba: пакет Nullume туда уезжает
# вместе со всей рабочей веткой. Его красный крестик садился на коммит выкатки
# чужого проекта и делал вид, что сломана выкатка. Пакет проверяется в рабочей
# ветке и в pull request — этого достаточно, в ветку выкатки он попадает уже
# проверенным.
on:
  push:
    branches-ignore:
      - 'deploy/**'
    paths:
      - 'tools/nullume/**'
  pull_request:
    paths:
      - 'tools/nullume/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/nullume

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/nullume/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Проверка упаковки пакета (без публикации)
        run: npm pack --dry-run
