name: Wordstat (частотность)

# Собирает частотность запросов через Wordstat XMLRiver — сколько людей
# в месяц задают каждый запрос. Основной сбор выдачи этого не даёт, а без
# частотности карта конкуренции слепа: топ-1 по запросу, который никто не
# ищет, денег не приносит.
#
# Ключ — из секретов репозитория, в логах не появляется.
# Секреты: Settings → Secrets and variables → Actions
#   XMLRIVER_USER, XMLRIVER_KEY

on:
  workflow_dispatch:
    inputs:
      queries_file:
        description: 'Файл со списком запросов'
        type: string
        default: 'docs/projects/vet-clinic/queries.txt'
      region:
        description: 'Регион Яндекса (213 — Москва)'
        type: string
        default: '213'
      out:
        description: 'Куда сохранить CSV'
        type: string
        default: 'docs/projects/vet-clinic/data/wordstat.csv'

concurrency:
  group: wordstat
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверить ключ одним запросом
        env:
          XMLRIVER_USER: ${{ secrets.XMLRIVER_USER }}
          XMLRIVER_KEY: ${{ secrets.XMLRIVER_KEY }}
        run: |
          set -euo pipefail
          U=$(printf '%s' "$XMLRIVER_USER" | tr -d '[:space:]')
          K=$(printf '%s' "$XMLRIVER_KEY" | tr -d '[:space:]')
          if [ -z "$U" ] || [ -z "$K" ]; then
            echo "::error::Не заданы секреты XMLRIVER_USER / XMLRIVER_KEY."
            exit 1
          fi
          echo "Длина user_id: ${#U}; длина ключа: ${#K}."
          RESP=$(curl -sS --max-time 30 "https://xmlriver.com/wordstat/new/json?user=${U}&key=${K}&query=test&regions=${{ inputs.region }}" || true)
          # Структуру ответа печатает отдельный скрипт: значения обрезаются,
          # данные аккаунта в лог не попадают.
          printf '%s' "$RESP" | python3 tools/seo/wordstat_shape.py

      - name: Собрать частотность
        env:
          XMLRIVER_USER: ${{ secrets.XMLRIVER_USER }}
          XMLRIVER_KEY: ${{ secrets.XMLRIVER_KEY }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python tools/seo/collect_wordstat.py \
            "${{ inputs.queries_file }}" \
            "${{ inputs.out }}" \
            --region "${{ inputs.region }}"

      - name: Сохранить в репозиторий
        if: always()
        run: |
          set -euo pipefail
          [ -f "${{ inputs.out }}" ] || { echo "Файла нет — нечего коммитить."; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELATED="$(dirname "${{ inputs.out }}")/wordstat-related.csv"
          git add "${{ inputs.out }}"
          [ -f "$RELATED" ] && git add "$RELATED"
          if git diff --cached --quiet; then
            echo "Изменений нет."
            exit 0
          fi
          git commit -m "Wordstat: частотность запросов (регион ${{ inputs.region }})"
          # Пока шёл сбор, в ветку могли запушить другие сессии.
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Приложить артефактом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordstat-${{ inputs.region }}
          path: |
            ${{ inputs.out }}
            docs/projects/**/wordstat-related.csv
          if-no-files-found: warn
          retention-days: 14
