name: Perfect Skin — bestsellers scene media (kie)

# Генерация кадров и роликов сцены «рука + 4 товара» через Nullume/kie.ai.
# Результат коммитится в docs/projects/perfect-skin/media/bestsellers-v2/.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'images — все кадры, gaps — кадр без товара, hands — кадры с рукой, videos — ролики'
        type: choice
        options: [images, gaps, hands, videos, hero, hero-turn, hero-wide, hero-wide2, hero-crack, hero-start, hero-start2, hero-start3, hero-start4, hero-mid, hero-ab, hero-ab2, hero-video, wide, wide2, mobpad, v3-gaps, v3-hands, v3-videos]
        default: images
      frames:
        description: 'Только эти кадры через пробел (например: desktop-k1 mobile-k2 desktop-k0h). Пусто — все'
        type: string
        default: ''
      variants:
        description: 'Вариантов на кадр'
        type: string
        default: '1'
      clips:
        description: 'stage=videos: только эти ролики через пробел (например: desktop-0-1). Пусто — все 8'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: perfect-skin-bestsellers-media
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      NULLUME_HOME: ${{ github.workspace }}/.nullume-run
      STAGE: ${{ inputs.stage }}
      FRAMES: ${{ inputs.frames }}
      VARIANTS: ${{ inputs.variants }}
      CLIPS: ${{ inputs.clips }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/nullume/package-lock.json
      - name: Build nullume
        working-directory: tools/nullume
        run: npm ci && npm run build
      - name: Install ffmpeg
        # Статический бинарь вместо apt: установка через apt однажды заняла 16 минут.
        run: |
          d=$(mktemp -d)
          if curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C "$d" --strip-components=1 --wildcards '*/ffmpeg'; then
            sudo install -m 755 "$d/ffmpeg" /usr/local/bin/ffmpeg
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Balance
        run: node tools/nullume/bin/nullume.js balance
      - name: Generate
        run: bash projects/perfect-skin/media-gen/bestsellers.sh
      - name: Balance after
        if: always()
        run: node tools/nullume/bin/nullume.js balance
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/projects/perfect-skin/media/bestsellers-v2 docs/projects/perfect-skin/media/bestsellers-v3 docs/projects/perfect-skin/media/hero projects/perfect-skin/client/public/video/bestsellers 2>/dev/null || git add docs/projects/perfect-skin/media/bestsellers-v2
          git commit -m "Bestsellers scene media: $STAGE" || exit 0
          # При конфликте бинарников побеждают файлы этого прогона (-X theirs в
          # терминах rebase = наш переигрываемый коммит). Неудачный пуш — ошибка.
          ok=0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || { git rebase --abort || true; sleep 5; continue; }
            git push origin "HEAD:$GITHUB_REF_NAME" && { ok=1; break; }
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::push failed, generated media not saved"; exit 1; }
