name: Deploy Perfect Skin to VPS

on:
  push:
    branches:
      - deploy/perfect-skin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-perfect-skin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Служебные ключи вкладываются через envs и вписываются в .env функцией upsert_env
          # (пустой секрет не затирает существующее значение на сервере).
          SVC_SMTP_HOST: ${{ secrets.PS_SMTP_HOST }}
          SVC_SMTP_PORT: ${{ secrets.PS_SMTP_PORT }}
          SVC_SMTP_USER: ${{ secrets.PS_SMTP_USER }}
          SVC_SMTP_PASS: ${{ secrets.PS_SMTP_PASS }}
          SVC_SMTP_FROM: ${{ secrets.PS_SMTP_FROM }}
          SVC_SMTP_SECURE: ${{ secrets.PS_SMTP_SECURE }}
          SVC_SMS_PROVIDER: ${{ secrets.PS_SMS_PROVIDER }}
          SVC_SMS_API_KEY: ${{ secrets.PS_SMS_API_KEY }}
          SVC_SMS_SENDER: ${{ secrets.PS_SMS_SENDER }}
          SVC_PS_1C_LOGIN: ${{ secrets.PS_1C_LOGIN }}
          SVC_PS_1C_PASSWORD: ${{ secrets.PS_1C_PASSWORD }}
          SVC_PS_TG_BOT_TOKEN: ${{ secrets.PS_TG_BOT_TOKEN }}
          SVC_PS_TG_BOT_USERNAME: ${{ secrets.PS_TG_BOT_USERNAME }}
          SVC_PS_TG_ORDERS_BOT_TOKEN: ${{ secrets.PS_TG_ORDERS_BOT_TOKEN }}
          SVC_PS_TG_ORDERS_BOT_USERNAME: ${{ secrets.PS_TG_ORDERS_BOT_USERNAME }}
          SVC_PS_DADATA_API_KEY: ${{ secrets.PS_DADATA_API_KEY }}
          SVC_PS_ADMIN_PASSWORD: ${{ secrets.PS_ADMIN_PASSWORD }}
          SVC_PS_CDEK: ${{ vars.PS_CDEK }}
          SVC_PS_CDEK_CLIENT_ID: ${{ secrets.PS_CDEK_CLIENT_ID }}
          SVC_PS_CDEK_CLIENT_SECRET: ${{ secrets.PS_CDEK_CLIENT_SECRET }}
          SVC_PS_CDEK_WEBHOOK_SECRET: ${{ secrets.PS_CDEK_WEBHOOK_SECRET }}
          SVC_PS_CDEK_BASE_URL: ${{ vars.PS_CDEK_BASE_URL }}
          SVC_PS_CDEK_FROM_CITY_CODE: ${{ vars.PS_CDEK_FROM_CITY_CODE }}
          SVC_PS_CDEK_FROM_POSTAL_CODE: ${{ vars.PS_CDEK_FROM_POSTAL_CODE }}
          SVC_PS_CDEK_FROM_ADDRESS: ${{ vars.PS_CDEK_FROM_ADDRESS }}
          SVC_PS_CDEK_SHIPMENT_POINT: ${{ vars.PS_CDEK_SHIPMENT_POINT }}
          SVC_PS_CDEK_TARIFF_PVZ: ${{ vars.PS_CDEK_TARIFF_PVZ }}
          SVC_PS_CDEK_TARIFF_POSTAMAT: ${{ vars.PS_CDEK_TARIFF_POSTAMAT }}
          SVC_PS_CDEK_TARIFF_COURIER: ${{ vars.PS_CDEK_TARIFF_COURIER }}
          SVC_PS_CDEK_BOX: ${{ vars.PS_CDEK_BOX }}
          SVC_PS_CDEK_BOX_WEIGHT_G: ${{ vars.PS_CDEK_BOX_WEIGHT_G }}
          SVC_PS_CDEK_ITEM_WEIGHT_G: ${{ vars.PS_CDEK_ITEM_WEIGHT_G }}
          SVC_PS_CDEK_PAID_DELIVERY: ${{ vars.PS_CDEK_PAID_DELIVERY }}
          SVC_PS_CDEK_AUTO_CREATE: ${{ vars.PS_CDEK_AUTO_CREATE }}
          SVC_PS_CDEK_WEBHOOK: ${{ vars.PS_CDEK_WEBHOOK }}
          SVC_PS_CDEK_ORDER_PREFIX: ${{ vars.PS_CDEK_ORDER_PREFIX }}
        with:
          host: ${{ secrets.PS_DEPLOY_HOST }}
          username: ${{ secrets.PS_DEPLOY_USER }}
          key: ${{ secrets.PS_DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: SVC_SMTP_HOST,SVC_SMTP_PORT,SVC_SMTP_USER,SVC_SMTP_PASS,SVC_SMTP_FROM,SVC_SMTP_SECURE,SVC_SMS_PROVIDER,SVC_SMS_API_KEY,SVC_SMS_SENDER,SVC_PS_1C_LOGIN,SVC_PS_1C_PASSWORD,SVC_PS_TG_BOT_TOKEN,SVC_PS_TG_BOT_USERNAME,SVC_PS_TG_ORDERS_BOT_TOKEN,SVC_PS_TG_ORDERS_BOT_USERNAME,SVC_PS_DADATA_API_KEY,SVC_PS_ADMIN_PASSWORD,SVC_PS_CDEK,SVC_PS_CDEK_CLIENT_ID,SVC_PS_CDEK_CLIENT_SECRET,SVC_PS_CDEK_WEBHOOK_SECRET,SVC_PS_CDEK_BASE_URL,SVC_PS_CDEK_FROM_CITY_CODE,SVC_PS_CDEK_FROM_POSTAL_CODE,SVC_PS_CDEK_FROM_ADDRESS,SVC_PS_CDEK_SHIPMENT_POINT,SVC_PS_CDEK_TARIFF_PVZ,SVC_PS_CDEK_TARIFF_POSTAMAT,SVC_PS_CDEK_TARIFF_COURIER,SVC_PS_CDEK_BOX,SVC_PS_CDEK_BOX_WEIGHT_G,SVC_PS_CDEK_ITEM_WEIGHT_G,SVC_PS_CDEK_PAID_DELIVERY,SVC_PS_CDEK_AUTO_CREATE,SVC_PS_CDEK_WEBHOOK,SVC_PS_CDEK_ORDER_PREFIX
          script: |
            set -euo pipefail
            cd /var/www/ps-src

            command -v ffmpeg >/dev/null || echo "::warning::ffmpeg не установлен — загрузка видеоотзывов будет отклоняться"

            echo "==> Syncing service keys from GitHub secrets into projects/perfect-skin/server/.env"
            touch projects/perfect-skin/server/.env
            upsert_env() {
              local key="$1" value="$2"
              if [ -z "$value" ]; then echo "   $key: empty in secrets, left as is"; return; fi
              local escaped
              escaped=$(printf '%s' "$value" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
              if grep -q "^${key}=" projects/perfect-skin/server/.env; then
                sed -i "s|^${key}=.*|${key}=\"${escaped}\"|" projects/perfect-skin/server/.env
              else
                printf '%s="%s"\n' "$key" "$escaped" >> projects/perfect-skin/server/.env
              fi
              echo "   $key: set"
            }
            upsert_env SMTP_HOST "$SVC_SMTP_HOST"
            upsert_env SMTP_PORT "$SVC_SMTP_PORT"
            upsert_env SMTP_USER "$SVC_SMTP_USER"
            upsert_env SMTP_PASS "$SVC_SMTP_PASS"
            upsert_env SMTP_FROM "$SVC_SMTP_FROM"
            upsert_env SMTP_SECURE "$SVC_SMTP_SECURE"
            upsert_env SMS_PROVIDER "$SVC_SMS_PROVIDER"
            upsert_env SMS_API_KEY "$SVC_SMS_API_KEY"
            upsert_env SMS_SENDER "$SVC_SMS_SENDER"
            upsert_env PS_1C_LOGIN "$SVC_PS_1C_LOGIN"
            upsert_env PS_1C_PASSWORD "$SVC_PS_1C_PASSWORD"
            upsert_env PS_TG_BOT_TOKEN "$SVC_PS_TG_BOT_TOKEN"
            upsert_env PS_TG_BOT_USERNAME "$SVC_PS_TG_BOT_USERNAME"
            upsert_env PS_TG_ORDERS_BOT_TOKEN "$SVC_PS_TG_ORDERS_BOT_TOKEN"
            upsert_env PS_TG_ORDERS_BOT_USERNAME "$SVC_PS_TG_ORDERS_BOT_USERNAME"
            upsert_env PS_DADATA_API_KEY "$SVC_PS_DADATA_API_KEY"
            upsert_env PS_ADMIN_PASSWORD "$SVC_PS_ADMIN_PASSWORD"
            upsert_env PS_CDEK "$SVC_PS_CDEK"
            upsert_env PS_CDEK_CLIENT_ID "$SVC_PS_CDEK_CLIENT_ID"
            upsert_env PS_CDEK_CLIENT_SECRET "$SVC_PS_CDEK_CLIENT_SECRET"
            upsert_env PS_CDEK_WEBHOOK_SECRET "$SVC_PS_CDEK_WEBHOOK_SECRET"
            upsert_env PS_CDEK_BASE_URL "$SVC_PS_CDEK_BASE_URL"
            upsert_env PS_CDEK_FROM_CITY_CODE "$SVC_PS_CDEK_FROM_CITY_CODE"
            upsert_env PS_CDEK_FROM_POSTAL_CODE "$SVC_PS_CDEK_FROM_POSTAL_CODE"
            upsert_env PS_CDEK_FROM_ADDRESS "$SVC_PS_CDEK_FROM_ADDRESS"
            upsert_env PS_CDEK_SHIPMENT_POINT "$SVC_PS_CDEK_SHIPMENT_POINT"
            upsert_env PS_CDEK_TARIFF_PVZ "$SVC_PS_CDEK_TARIFF_PVZ"
            upsert_env PS_CDEK_TARIFF_POSTAMAT "$SVC_PS_CDEK_TARIFF_POSTAMAT"
            upsert_env PS_CDEK_TARIFF_COURIER "$SVC_PS_CDEK_TARIFF_COURIER"
            upsert_env PS_CDEK_BOX "$SVC_PS_CDEK_BOX"
            upsert_env PS_CDEK_BOX_WEIGHT_G "$SVC_PS_CDEK_BOX_WEIGHT_G"
            upsert_env PS_CDEK_ITEM_WEIGHT_G "$SVC_PS_CDEK_ITEM_WEIGHT_G"
            upsert_env PS_CDEK_PAID_DELIVERY "$SVC_PS_CDEK_PAID_DELIVERY"
            upsert_env PS_CDEK_AUTO_CREATE "$SVC_PS_CDEK_AUTO_CREATE"
            upsert_env PS_CDEK_WEBHOOK "$SVC_PS_CDEK_WEBHOOK"
            upsert_env PS_CDEK_ORDER_PREFIX "$SVC_PS_CDEK_ORDER_PREFIX"
            upsert_env PS_PRODUCT_IMAGES_DIR "/var/www/perfect-skin/uploads/products"
            upsert_env PS_VIDEO_REVIEWS_DIR "/var/www/perfect-skin/uploads/video-reviews"
            upsert_env PS_VIDEO_CONSENTS_DIR "/var/lib/perfect-skin/video-consents"

            echo "==> Fetching deploy/perfect-skin"
            git fetch origin deploy/perfect-skin
            git checkout deploy/perfect-skin
            git merge --ff-only origin/deploy/perfect-skin

            echo "==> Installing dependencies"
            # --include=dev: сборка идёт на сервере, а tsc/vite/prisma/tsx лежат
            # в devDependencies. Без флага любой NODE_ENV=production в окружении
            # тихо выбрасывает их, и падает не установка, а сборка.
            npm install --include=dev

            echo "==> Building @ps/shared"
            npm run build --workspace=@ps/shared

            echo "==> Generating Prisma client"
            (cd projects/perfect-skin/server && npx prisma generate)

            # docker compose подставляет POSTGRES_PASSWORD в описание сервиса
            # даже для чтения дампа, а psql ниже требует его напрямую. Берём из
            # .env, созданного при первичной установке: ключ живёт только там.
            set -a
            . projects/perfect-skin/server/.env
            set +a

            echo "==> Backing up database before any migration"
            mkdir -p /var/backups/perfect-skin
            BACKUP_FILE="/var/backups/perfect-skin/ps_backup_$(date +%Y%m%d_%H%M%S).dump"
            docker compose -f projects/perfect-skin/deploy/docker-compose.prod.yml \
              exec -T postgres pg_dump -U ps -d perfect_skin -F c > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            # Держим последние 10 дампов, остальное чистим
            ls -1t /var/backups/perfect-skin/ps_backup_*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f
            echo "Backup OK: $BACKUP_FILE"

            echo "==> Applying migrations"
            (cd projects/perfect-skin/server && npx prisma migrate deploy)

            echo "==> Applying database constraints"
            # Файл ограничений не входит в миграции, поэтому его надо применять
            # и здесь: иначе новое ограничение доедет до сервера только при
            # следующей первичной установке, то есть никогда. Выражения
            # идемпотентны, «already exists» — ожидаемый ответ; любая другая
            # ошибка валит выкатку.
            CONSTRAINTS_OUT="$(cd projects/perfect-skin/server && PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -h 127.0.0.1 -U ps -d perfect_skin -v ON_ERROR_STOP=0 -f prisma/sql/01-constraints.sql 2>&1)"
            echo "$CONSTRAINTS_OUT"
            if echo "$CONSTRAINTS_OUT" | grep "ERROR:" | grep -qv "already exists"; then
              echo "Ограничения применились не полностью — смотри ошибки выше."
              exit 1
            fi

            echo "==> Building server"
            npm run build --workspace=@ps/server

            echo "==> Building client with API URL"
            # Макет видеоотзывов на главной. Убрать до переключения на домен perfect-skin.shop
            VITE_DEMO_VIDEO_REVIEWS=1 npm run build --workspace=@ps/client

            echo "==> Deploying static files (before reload: new API must not meet the old bundle)"
            mkdir -p /var/www/perfect-skin/client
            mkdir -p /var/www/perfect-skin/uploads/products
            rm -rf /var/www/perfect-skin/client/*
            cp -r projects/perfect-skin/client/dist/* /var/www/perfect-skin/client/

            echo "==> Preparing video review storage"
            # Ролики отдаёт приложение через Nginx по внутреннему адресу; каталог не покрывается корнем сайта.
            # Документы согласий — приватный каталог, только для процесса (PM2 идёт под root).
            # .tmp — рядом с каталогом, чтобы rename шёл в пределах одной файловой системы.
            mkdir -p /var/www/perfect-skin/uploads/video-reviews /var/www/perfect-skin/uploads/video-reviews.tmp
            mkdir -p /var/lib/perfect-skin/video-consents /var/lib/perfect-skin/video-consents.tmp
            chmod 0700 /var/lib/perfect-skin/video-consents /var/lib/perfect-skin/video-consents.tmp

            echo "==> Sidecar health check for PM2 path consistency"
            EXPECTED_SCRIPT="$(pwd)/projects/perfect-skin/server/dist/index.js"
            if pm2 describe ps-server >/dev/null 2>&1 \
               && ! pm2 describe ps-server | grep -qF "$EXPECTED_SCRIPT"; then
              echo "   процесс смотрит на другой путь — пересоздаём"
              pm2 delete ps-server
            fi

            echo "==> Reloading application via PM2"
            pm2 startOrReload projects/perfect-skin/deploy/ecosystem.config.js --update-env
            pm2 save

            echo "==> Verifying PM2 points to correct script"
            if ! pm2 describe ps-server | grep -qF "$EXPECTED_SCRIPT"; then
              echo "PM2 всё ещё запущен не из $EXPECTED_SCRIPT"
              pm2 describe ps-server | grep -Ei 'script path|exec cwd'
              exit 1
            fi

            echo "==> Health check"
            # До 30 секунд с повторами: под нагрузкой после сборки сервер
            # поднимается дольше двух секунд. `|| true` обязателен — при
            # set -e неудачный curl внутри $(...) обрывал скрипт раньше, чем
            # печатались сообщение и логи, и в отчёте оставался голый код 7.
            STATUS=000
            for i in $(seq 1 15); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/health || true)
              [ "$STATUS" = "200" ] && break
              sleep 2
            done
            if [ "$STATUS" != "200" ]; then
              echo "Health check FAILED: HTTP $STATUS"
              pm2 logs ps-server --lines 40 --nostream --err
              exit 1
            fi
            echo "Health check OK: HTTP $STATUS"

            echo "==> Deploy complete"
