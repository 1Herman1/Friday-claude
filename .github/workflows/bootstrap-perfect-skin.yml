name: Bootstrap Perfect Skin Server

# Первичная настройка ЧИСТОЙ Ubuntu 26.04 на Timeweb Cloud.
#
# Запускается вручную и РОВНО ДВА РАЗА:
#   1-й запуск — ставит окружение и генерирует ключ развёртывания, после чего
#      останавливается и печатает открытый ключ. Его нужно добавить в GitHub:
#      Settings → Deploy keys → Add deploy key (доступ только на чтение).
#   2-й запуск — клонирует репозиторий этим ключом и доводит настройку до конца.
#
# Почему так: репозиторий приватный, а закрытый ключ не должен покидать сервер.
# Токен в URL удобнее, но он оседает в .git/config в открытом виде.
#
# Скрипт идемпотентен: повторный запуск ничего не ломает и не перетирает
# уже сгенерированные секреты.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PS_DEPLOY_HOST }}
          username: ${{ secrets.PS_DEPLOY_USER }}
          key: ${{ secrets.PS_DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            SRC=/var/www/ps-src
            STATIC=/var/www/perfect-skin/client
            BACKUPS=/var/backups/perfect-skin
            REPO_SSH="git@github.com:1Herman1/Friday-claude.git"
            BRANCH=deploy/perfect-skin
            ENV_FILE="$SRC/projects/perfect-skin/server/.env"
            COMPOSE="$SRC/projects/perfect-skin/deploy/docker-compose.prod.yml"

            echo "==> Пакеты"
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # Node 22 LTS: на 20-й ветке поддержка закончилась в апреле 2026,
            # и разработка проекта идёт на 22-й — расхождение версий между
            # машиной сборки и сервером ловится только в проде.
            if ! command -v node >/dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            fi
            apt-get install -y -qq nodejs docker.io docker-compose-v2 \
              nginx certbot python3-certbot-nginx postgresql-client git
            systemctl enable --now docker
            command -v pm2 >/dev/null || npm install -g pm2
            pm2 startup systemd -u root --hp /root >/dev/null || true

            echo "==> Межсетевой экран"
            ufw allow OpenSSH >/dev/null
            ufw allow 80/tcp >/dev/null
            ufw allow 443/tcp >/dev/null
            ufw --force enable >/dev/null

            echo "==> Каталоги"
            mkdir -p "$SRC" "$STATIC" "$BACKUPS"

            echo "==> Ключ развёртывания"
            # Ключ генерируется на сервере и никогда его не покидает.
            if [ ! -f /root/.ssh/id_ed25519 ]; then
              mkdir -p /root/.ssh && chmod 700 /root/.ssh
              ssh-keygen -t ed25519 -N "" -C "perfect-skin-server" -f /root/.ssh/id_ed25519 >/dev/null
            fi
            ssh-keyscan -t ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null
            sort -u -o /root/.ssh/known_hosts /root/.ssh/known_hosts

            # Проверяем не «пускает ли GitHub вообще», а доступ именно к этому
            # репозиторию: ключ развёртывания привязан к одному репозиторию, и
            # успешный вход сам по себе ничего не гарантирует. Ответ сервера
            # печатаем целиком — без него причина отказа невидима.
            echo "Ответ GitHub на вход по ключу:"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -T git@github.com 2>&1 | sed 's/^/  /' || true
            echo "Ответ GitHub на запрос репозитория:"
            GIT_ACCESS_OUT="$(GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=no' git ls-remote "$REPO_SSH" HEAD 2>&1 || true)"
            echo "$GIT_ACCESS_OUT" | sed 's/^/  /'

            if ! echo "$GIT_ACCESS_OUT" | grep -q "HEAD"; then
              echo ""
              echo "ОСТАНОВКА: сервер пока не имеет доступа к приватному репозиторию."
              echo ""
              echo "Добавьте этот ключ в GitHub → репозиторий → Settings → Deploy keys"
              echo "→ Add deploy key (галочку «Allow write access» НЕ ставить):"
              echo ""
              cat /root/.ssh/id_ed25519.pub
              echo ""
              echo "После этого запустите этот workflow ещё раз."
              exit 1
            fi
            echo "Доступ к репозиторию есть."

            echo "==> Исходники"
            if [ ! -d "$SRC/.git" ]; then
              git clone "$REPO_SSH" "$SRC"
            fi
            cd "$SRC"
            git remote set-url origin "$REPO_SSH"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            echo "==> Секреты приложения"
            # Генерируются один раз. Пароль базы хранится ОТДЕЛЬНОЙ строкой, а не
            # вычитывается обратно из URL: разбор строки подключения регулярками
            # молча выдавал бы не тот пароль, и Postgres поднялся бы с чужим.
            if [ ! -f "$ENV_FILE" ]; then
              PS_DB_PASSWORD="$(openssl rand -hex 24)"
              {
                echo "NODE_ENV=production"
                echo "PORT=3000"
                echo "HOST=127.0.0.1"
                echo "POSTGRES_PASSWORD=${PS_DB_PASSWORD}"
                echo "PS_DATABASE_URL=postgresql://ps:${PS_DB_PASSWORD}@127.0.0.1:5432/perfect_skin"
                echo "PS_COOKIE_SECRET=$(openssl rand -hex 32)"
                echo "JWT_SECRET=$(openssl rand -hex 32)"
                echo "PS_PROMO_HMAC_SECRET=$(openssl rand -hex 32)"
                echo "PS_CORS_ORIGIN=https://new.perfect-skin.shop"
              } > "$ENV_FILE"
              chmod 600 "$ENV_FILE"
              echo "Создан .env с новыми секретами."
            else
              echo ".env уже есть — не трогаю."
            fi

            set -a
            . "$ENV_FILE"
            set +a

            echo "==> Postgres"
            docker compose -f "$COMPOSE" up -d
            for i in $(seq 1 30); do
              if docker compose -f "$COMPOSE" exec -T postgres pg_isready -U ps -d perfect_skin >/dev/null 2>&1; then
                echo "Postgres готов."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "Postgres не поднялся за 60 секунд."
                docker compose -f "$COMPOSE" logs --tail 40 postgres
                exit 1
              fi
              sleep 2
            done

            echo "==> Зависимости и схема"
            cd "$SRC"
            npm install --no-audit --no-fund
            npm run build --workspace=@ps/shared
            cd "$SRC/projects/perfect-skin/server"
            npx prisma generate
            npx prisma migrate deploy

            echo "==> Ограничения уровня базы"
            # Не часть миграций. Повторный прогон упрётся в «already exists» —
            # это нормально, поэтому гасим только его, а не любые ошибки.
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U ps -d perfect_skin \
              -v ON_ERROR_STOP=0 -f prisma/sql/01-constraints.sql 2>&1 \
              | grep -v "already exists" || true

            echo "==> Каталог товаров"
            PRODUCTS=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U ps -d perfect_skin -tAc "SELECT COUNT(*) FROM products")
            if [ "$PRODUCTS" = "0" ]; then
              NODE_ENV=production npx tsx prisma/seed.ts
              echo "Каталог засеян."
            else
              echo "В каталоге уже $PRODUCTS товаров — сид пропущен."
            fi

            echo "==> Nginx"
            cp "$SRC/projects/perfect-skin/deploy/nginx-perfect-skin.conf" \
               /etc/nginx/sites-available/perfect-skin
            ln -sf /etc/nginx/sites-available/perfect-skin \
                   /etc/nginx/sites-enabled/perfect-skin
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl reload nginx

            echo ""
            echo "Готово. Дальше:"
            echo "  1) certbot --nginx -d new.perfect-skin.shop"
            echo "  2) запустить workflow «Deploy Perfect Skin»"
