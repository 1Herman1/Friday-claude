name: Serum motion transfer (one Seedance mini job)
"on":
  push:
    branches: [ci/serum-seedance-mini-singlejob]
    paths:
      - .github/workflows/serum-motion-transfer.yml
      - tools/nullume/scripts/serum-motion-*.mjs
      - docs/projects/perfect-skin/media-review/serum-motion-transfer/**
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: dry-run
        options: [dry-run, generate-one, recover-existing-task]
        description: Exactly one reviewed fixed case, or GET-only recovery
      confirmation:
        type: choice
        required: true
        default: none
        options: [none, confirm-serum-motion-one-100]
        description: Quoted 100 credits USD0.50, NOT a provider-enforced ceiling
      task_id:
        type: string
        default: ''
        description: Existing sanitized receipt task ID, recovery only
      source_run_id:
        type: string
        default: ''
        description: Original receipt run ID, recovery only
permissions:
  contents: read
concurrency:
  group: serum-motion-transfer-one
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Offline hostile-input and duplicate-create regression tests, no credentials
        run: node --test tools/nullume/scripts/serum-motion-transfer.test.mjs
      - name: Credential-free archived schema, 709-row quote, freeze and encrypted bundle validation
        run: node tools/nullume/scripts/serum-motion-transfer.mjs dry-run
  paid:
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' && github.run_attempt == '1' &&
      github.ref == 'refs/heads/ci/serum-seedance-mini-singlejob' &&
      ((inputs.mode == 'generate-one' && inputs.confirmation == 'confirm-serum-motion-one-100') || inputs.mode == 'recover-existing-task')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Reuse protected environment without changing any of its protection rules.
    # SERUM_MOTION_* variables are independent of the old Kling adapter's arming.
    environment: serum3-pilot
    env:
      SERUM_MOTION_APPROVED_RUN_ID: ${{ vars.SERUM_MOTION_APPROVED_RUN_ID }}
      SERUM_MOTION_APPROVED_SHA: ${{ vars.SERUM_MOTION_APPROVED_SHA }}
      SERUM_MOTION_ARMED: ${{ vars.SERUM_MOTION_ARMED }}
      SERUM_MOTION_CONFIRMATION: ${{ inputs.confirmation }}
      SERUM_MOTION_TASK_ID: ${{ inputs.task_id }}
      SERUM_MOTION_APPROVED_TASK_ID: ${{ vars.SERUM_MOTION_RECOVERY_TASK_ID }}
      SERUM_MOTION_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SERUM_MOTION_APPROVED_SOURCE_RUN_ID: ${{ vars.SERUM_MOTION_RECOVERY_SOURCE_RUN_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install decoder and rerun tests before any credential injection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          node --test tools/nullume/scripts/serum-motion-transfer.test.mjs
      - name: Require independent exact-run and exact-SHA environment arming before secrets
        id: gate
        env:
          MODE: ${{ inputs.mode }}
        run: >-
          node --input-type=module -e "import {authorize} from './tools/nullume/scripts/serum-motion-transfer.mjs'; authorize(process.env, process.env.MODE === 'recover-existing-task');"
      - name: Verify and decode all eight frozen assets; upload and submit exactly once (no retry)
        id: submit
        if: inputs.mode == 'generate-one'
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          SERUM_MOTION_ASSET_KEY: ${{ secrets.SERUM_MOTION_ASSET_KEY }}
        run: node tools/nullume/scripts/serum-motion-transfer.mjs generate-one
      - name: Durably publish sanitized receipt BEFORE any polling
        id: receipt
        if: always() && steps.submit.outputs.task_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serum-motion-task-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/serum-motion-result/task-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Bounded GET-only retrieval; no upload, credit check or create in this process
        id: retrieve
        if: >-
          always() && steps.gate.outcome == 'success' &&
          ((steps.receipt.outcome == 'success' && steps.submit.outputs.task_id != '') || inputs.mode == 'recover-existing-task')
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          SERUM_MOTION_TASK_ID: ${{ steps.submit.outputs.task_id || inputs.task_id }}
          SERUM_MOTION_APPROVED_TASK_ID: ${{ steps.submit.outputs.task_id || vars.SERUM_MOTION_RECOVERY_TASK_ID }}
          SERUM_MOTION_SOURCE_RUN_ID: ${{ steps.submit.outputs.task_id && github.run_id || inputs.source_run_id }}
          SERUM_MOTION_APPROVED_SOURCE_RUN_ID: ${{ steps.submit.outputs.task_id && github.run_id || vars.SERUM_MOTION_RECOVERY_SOURCE_RUN_ID }}
        run: node tools/nullume/scripts/serum-motion-transfer.mjs recover-existing-task
      - name: Preserve original output and sanitized metadata (not design accepted)
        if: always() && steps.retrieve.outcome != '' && steps.retrieve.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serum-motion-output-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/serum-motion-result/unverified.mp4
            ${{ runner.temp }}/serum-motion-result/result.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
