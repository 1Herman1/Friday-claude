name: Perfect Skin — daily purge of expired specialist documents

# Сканы документов специалистов удаляются через 30 дней после решения
# менеджера (и сразу у удалённых аккаунтов). Это обещание из политики и с
# формы заявки, поэтому оно выполняется расписанием, а не вручную.
# Стирание заявок консультаций и Отдела заботы необратимо, поэтому перед
# чисткой берётся снимок БД (тот же pg_dump, что при выкатке).

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-perfect-skin
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PS_DEPLOY_HOST }}
          username: ${{ secrets.PS_DEPLOY_USER }}
          key: ${{ secrets.PS_DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/ps-src/projects/perfect-skin/server
            set -a; . ./.env; set +a

            echo "==> Snapshot of the database before purge"
            PURGE_DIR=/var/backups/perfect-skin/purge
            mkdir -p "$PURGE_DIR"
            PURGE_FILE="$PURGE_DIR/ps_purge_$(date +%Y%m%d_%H%M%S).dump"
            docker compose -f /var/www/ps-src/projects/perfect-skin/deploy/docker-compose.prod.yml \
              exec -T postgres pg_dump -U ps -d perfect_skin -F c > "$PURGE_FILE"
            test -s "$PURGE_FILE"
            # Держим 14 последних снимков, старше 14 дней удаляем
            find "$PURGE_DIR" -name 'ps_purge_*.dump' -mtime +14 -delete
            ls -1t "$PURGE_DIR"/ps_purge_*.dump | tail -n +15 | xargs -r rm -f
            echo "Snapshot OK: $PURGE_FILE"

            npm run purge:pro-docs -- --apply
