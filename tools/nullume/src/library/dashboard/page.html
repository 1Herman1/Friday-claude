<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nullume — библиотека вкуса</title>
  <style nonce="">
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-tertiary: #efefef;
      --text-primary: #000000;
      --text-secondary: #666666;
      --text-tertiary: #6e6e6e;
      --border: #e0e0e0;
      --accent: #0066cc;
      --accent-hover: #0052a3;
      --success: #22863a;
      --error: #cb2431;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 24px;
      --radius: 4px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1e;
        --bg-secondary: #2d2d2d;
        --bg-tertiary: #383838;
        --text-primary: #ffffff;
        --text-secondary: #cccccc;
        --text-tertiary: #999999;
        --border: #404040;
        --accent: #4a90e2;
        --accent-hover: #357abd;
        --success: #28a745;
        --error: #f85149;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background-color: var(--bg-primary);
    }

    header,
    .tabs,
    [role="tabpanel"],
    .footer {
      max-width: 1180px;
      margin-inline: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    h1, h2, h3 {
      margin: 0;
      font-weight: 600;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: var(--spacing-lg);
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: var(--spacing-sm);
    }

    h1 {
      margin-bottom: 4px;
    }

    .header-subtitle {
      margin: 0 0 24px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: var(--spacing-lg);
    }

    h3 {
      font-size: 16px;
      margin-bottom: var(--spacing-md);
      margin-top: 32px;
    }

    label {
      display: block;
      font-weight: 500;
      font-size: 14px;
      margin-bottom: var(--spacing-sm);
    }

    input, select, textarea {
      width: 100%;
      padding: var(--spacing-md) var(--spacing-lg);
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 44px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"] {
      max-width: 140px;
    }

    #cluster-k {
      max-width: 200px;
    }

    [role="tabpanel"] > button {
      margin: 4px 0 28px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      padding: var(--spacing-md) var(--spacing-lg);
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--border);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(:disabled) {
      background-color: var(--bg-tertiary);
      border-color: var(--accent);
    }

    button.primary {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    button.primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.danger {
      background-color: rgba(203, 36, 49, 0.1);
      color: var(--error);
      border-color: var(--error);
    }

    button.danger:hover {
      background-color: rgba(203, 36, 49, 0.2);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--spacing-xl);
      gap: var(--spacing-lg);
    }

    @media (max-width: 640px) {
      .tabs {
        gap: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
    }

    [role="tab"] {
      padding: var(--spacing-md) var(--spacing-lg);
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }

    @media (max-width: 640px) {
      [role="tab"] {
        padding: 12px;
        white-space: nowrap;
        flex: 0 0 auto;
      }
    }

    [role="tab"]:hover {
      color: var(--text-primary);
    }

    [role="tab"][aria-selected="true"] {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    [role="tabpanel"] {
      display: none;
    }

    [role="tabpanel"][data-active="true"] {
      display: block;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 24px;
      max-width: 560px;
    }

    .form-group > button {
      align-self: flex-start;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-lg);
    }

    @media (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--spacing-lg);
      margin-top: var(--spacing-xl);
    }

    .ref-card {
      display: grid;
      grid-template-rows: 1fr auto;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .ref-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .ref-thumb {
      aspect-ratio: 1;
      overflow: hidden;
    }

    .ref-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ref-caption {
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .side-panel {
      display: none;
      position: fixed;
      right: 0;
      top: 0;
      width: 440px;
      height: 100vh;
      background-color: var(--bg-primary);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: var(--spacing-lg);
      z-index: 1000;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .side-panel {
        width: 100%;
        height: auto;
        position: static;
        border-left: none;
        border-top: 1px solid var(--border);
        box-shadow: none;
      }
    }

    .side-panel.active {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .side-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-lg);
    }

    .side-panel-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 24px;
      color: var(--text-secondary);
      min-width: auto;
      min-height: auto;
      padding: 0;
    }

    .preview {
      width: 100%;
      max-height: 300px;
      margin-bottom: var(--spacing-lg);
      border-radius: var(--radius);
      object-fit: contain;
      background-color: var(--bg-secondary);
    }

    .palette {
      display: flex;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-lg);
      height: 24px;
    }

    .palette-item {
      flex: 1;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
    }

    .chip-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0;
      min-width: auto;
      min-height: auto;
      font-size: 16px;
    }

    .range-control {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    input[type="range"] {
      width: 100%;
      height: auto;
      padding: 0;
      border: none;
      background: none;
      min-height: auto;
    }

    .range-value {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-message {
      padding: var(--spacing-lg);
      border-radius: var(--radius);
      margin-bottom: var(--spacing-lg);
      display: none;
    }

    .status-message.show {
      display: block;
    }

    .status-message.success {
      background-color: rgba(34, 134, 58, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .status-message.error {
      background-color: rgba(203, 36, 49, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .button-group {
      display: flex;
      gap: var(--spacing-lg);
      flex-wrap: wrap;
    }

    .button-group.full {
      width: 100%;
    }

    .button-group button {
      flex: 1;
      min-width: 120px;
    }

    .family-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 32px;
    }

    fieldset > legend {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .dials {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 320px));
      gap: 20px 32px;
    }

    .side-panel .dials {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .range-control {
      max-width: 320px;
    }

    .range-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-sm);
    }

    .range-label label {
      margin-bottom: 0;
    }

    .range-label output {
      font-weight: 500;
      color: var(--text-primary);
    }

    .range-value {
      display: flex;
      justify-content: space-between;
    }

    .hint {
      max-width: 68ch;
      margin: 12px 0 0;
    }

    .side-panel .form-group {
      max-width: none;
    }

    .side-panel-buttons {
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
      align-items: center;
      margin-top: auto;
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .side-panel-buttons button {
      flex: 0 0 auto;
      min-width: 140px;
    }

    .side-panel-buttons [data-action="close-editor"] {
      background: none;
      border: none;
      padding: 0;
      color: var(--text-primary);
      margin-left: auto;
      min-width: auto;
      font-weight: 500;
      font-size: 14px;
    }

    .side-panel-buttons [data-action="close-editor"]:hover {
      color: var(--accent);
      background: none;
      border: none;
    }

    .family-card:hover {
      border-color: var(--accent);
    }

    .family-header {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }

    .family-title {
      flex: 1;
    }

    .family-status {
      margin-left: 12px;
    }

    .family-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
    }

    .family-slug {
      font-size: 12px;
      color: var(--text-tertiary);
      font-family: monospace;
    }

    .family-status {
      display: inline-block;
      padding: var(--spacing-xs) var(--spacing-sm);
      border-radius: 2px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .family-status.approved {
      background-color: #e6f4ea;
      color: #12622b;
    }

    .family-status.proposed {
      background-color: #e4eefb;
      color: #004c99;
    }

    .family-status.discarded {
      background-color: #fdeaec;
      color: #a31621;
    }

    .family-status.merged {
      background-color: #ededed;
      color: #5a5a5a;
    }

    .family-size {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-md);
    }

    .family-summary {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      margin-bottom: var(--spacing-md);
    }

    .family-palette {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-md);
    }

    .family-palette-item {
      width: 48px;
      height: 32px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    .family-exemplars {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      overflow-x: auto;
      padding-bottom: var(--spacing-sm);
    }

    .family-exemplar-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .family-actions {
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
      align-items: center;
    }

    .merge-group {
      display: flex;
      gap: 0;
      margin-left: 24px;
    }

    .merge-group select {
      width: 220px;
      border-radius: 4px 0 0 4px;
    }

    .merge-group button {
      border-radius: 0 4px 4px 0;
      margin-left: -1px;
    }

    [data-action="family-discard"] {
      margin-left: 16px;
    }

    [data-action="edit-family"] {
      margin-left: auto;
    }

    [data-action="copy-generate-command"] {
      flex: 0 0 auto;
      min-width: 160px;
    }

    @media (max-width: 480px) {
      .family-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .merge-group, [data-action="edit-family"] {
        grid-column: 1 / -1;
        margin: 0;
      }
    }

    .hr {
      margin: var(--spacing-xl) 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    .footer {
      margin-top: var(--spacing-xl);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: var(--spacing-lg);
    }

    .refs-more-btn {
      width: 100%;
      margin-top: var(--spacing-lg);
      display: none;
    }

    .refs-more-btn.show {
      display: inline-flex;
    }

    .editor {
      display: none;
    }

    .editor.active {
      display: block;
    }

    .exemplars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .exemplar-item {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      align-items: center;
      cursor: pointer;
    }

    .exemplar-label {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      align-items: center;
      cursor: pointer;
      width: 100%;
      position: relative;
    }

    .exemplar-label::after {
      content: "";
      position: absolute;
      inset: -11px;
    }

    .exemplar-preview {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background-color: var(--bg-secondary);
    }

    .exemplar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .exemplar-toggle {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 2px;
      background-color: var(--bg-secondary);
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
      position: absolute;
      top: 6px;
      right: 6px;
    }

    .exemplar-toggle:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .exemplar-label:has(.exemplar-toggle:checked) .exemplar-preview {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    .ref-tags-input-row {
      display: flex;
      gap: var(--spacing-sm);
    }

    .ref-tags-input-row input {
      flex: 1;
    }
      .hint { color: var(--text-secondary); font-size: 14px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <header>
    <h1>Библиотека вкуса</h1>
    <p class="header-subtitle">Nullume — систематизация стилей и образцов для генерации</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" aria-controls="refs-panel" tabindex="0" data-tab="refs">Референсы</button>
    <button role="tab" aria-selected="false" aria-controls="gather-panel" tabindex="-1" data-tab="gather">Собрать</button>
    <button role="tab" aria-selected="false" aria-controls="families-panel" tabindex="-1" data-tab="families">Семейства</button>
    <button role="tab" aria-selected="false" aria-controls="cluster-panel" tabindex="-1" data-tab="cluster">Кластеризация</button>
  </div>

  <!-- Референсы -->
  <div role="tabpanel" id="refs-panel" data-active="true">
    <h2>Поиск референсов</h2>

    <div class="form-group">
      <label for="refs-source">Источник</label>
      <select id="refs-source"></select>
    </div>

    <div class="form-group">
      <label for="refs-family">Семейство</label>
      <select id="refs-family">
        <option value="">Все</option>
      </select>
    </div>

    <div class="form-group">
      <label for="refs-query">Поиск</label>
      <input type="text" id="refs-query" placeholder="Введите поисковый запрос">
    </div>

    <button class="primary" data-action="search-refs">Найти</button>

    <div id="refs-status" class="status-message"></div>

    <div class="grid" id="refs-grid"></div>

    <button id="refs-more" class="primary refs-more-btn" data-action="load-more-refs">
      Показать ещё
    </button>
  </div>

  <!-- Собрать -->
  <div role="tabpanel" id="gather-panel" data-active="false">
    <h2>Импорт и добавление файлов</h2>

    <div class="form-group">
      <label for="import-source">Источник</label>
      <select id="import-source"></select>
      <p id="import-source-hint" class="hint" aria-describedby="import-source-hint"></p>
    </div>

    <div class="form-group">
      <label for="import-query">Запрос (опционально)</label>
      <input type="text" id="import-query" placeholder="Например: button">
    </div>

    <div class="form-group">
      <label for="import-collection">Коллекция / доска (опционально)</label>
      <input type="text" id="import-collection" placeholder="Например: Material Design">
    </div>

    <div class="form-group">
      <label for="import-limit">Лимит</label>
      <input type="number" id="import-limit" value="30" min="1" max="100">
    </div>

    <button class="primary" data-action="import-refs">Импортировать</button>

    <div id="import-status" class="status-message"></div>

    <div class="hr"></div>

    <h3>Добавить локальные файлы</h3>

    <div class="form-group">
      <label for="local-paths">Пути (по одному в строке)</label>
      <textarea id="local-paths" placeholder="/абсолютный/путь/image1.png&#10;/абсолютный/путь/image2.jpg"></textarea>
    </div>

    <button class="primary" data-action="add-local-files">Добавить</button>

    <div id="local-status" class="status-message"></div>
  </div>

  <!-- Семейства -->
  <div role="tabpanel" id="families-panel" data-active="false">
    <h2>Семейства стилей</h2>

    <div id="families-list"></div>
  </div>

  <!-- Редактор семейства (side panel) -->
  <div id="family-editor-panel" class="side-panel">
    <h3>Редактирование семейства</h3>

    <fieldset>
      <legend>Описание</legend>
      <div class="form-group">
        <label for="editor-name">Название</label>
        <input type="text" id="editor-name">
      </div>
      <div class="form-group">
        <label for="editor-slug">Слаг</label>
        <input type="text" id="editor-slug">
      </div>
      <div class="form-group">
        <label for="editor-summary">Резюме</label>
        <textarea id="editor-summary"></textarea>
      </div>
      <div class="form-group">
        <label>Настроение</label>
        <div id="editor-mood-chips" class="chips"></div>
        <div class="form-row">
          <input type="text" id="editor-mood-input" placeholder="Добавить слово">
          <button data-action="add-mood-chip">Добавить</button>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Регуляторы</legend>
      <div class="dials">
        <div class="form-group">
          <div class="range-label">
            <label for="editor-density">Плотность</label>
            <output id="editor-density-value">0.5</output>
          </div>
          <div class="range-control">
            <input type="range" id="editor-density" min="0" max="1" step="0.1" value="0.5">
            <div class="range-value">
              <span>0</span>
              <span>1</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="range-label">
            <label for="editor-variance">Вариативность</label>
            <output id="editor-variance-value">0.5</output>
          </div>
          <div class="range-control">
            <input type="range" id="editor-variance" min="0" max="1" step="0.1" value="0.5">
            <div class="range-value">
              <span>0</span>
              <span>1</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="range-label">
            <label for="editor-decor">Декор</label>
            <output id="editor-decor-value">0.5</output>
          </div>
          <div class="range-control">
            <input type="range" id="editor-decor" min="0" max="1" step="0.1" value="0.5">
            <div class="range-value">
              <span>0</span>
              <span>1</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="range-label">
            <label for="editor-symmetry">Симметрия</label>
            <output id="editor-symmetry-value">0.5</output>
          </div>
          <div class="range-control">
            <input type="range" id="editor-symmetry" min="0" max="1" step="0.1" value="0.5">
            <div class="range-value">
              <span>0</span>
              <span>1</span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="editor-spacing-density">Плотность отступов</label>
        <select id="editor-spacing-density">
          <option value="airy">Воздушно</option>
          <option value="balanced" selected>Сбалансировано</option>
          <option value="dense">Плотно</option>
        </select>
      </div>

      <div class="form-group">
        <label for="editor-motion-char">Характер движения</label>
        <select id="editor-motion-char">
          <option value="static">Статичный</option>
          <option value="calm" selected>Спокойный</option>
          <option value="snappy">Живой</option>
          <option value="expressive">Выразительный</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Промпты</legend>
      <div class="form-group">
        <label for="editor-prompt">Фрагмент промпта</label>
        <textarea id="editor-prompt"></textarea>
      </div>
      <div class="form-group">
        <label for="editor-negative">Негатив</label>
        <textarea id="editor-negative"></textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Образцы</legend>
      <div class="exemplars-grid" id="editor-exemplars"></div>
    </fieldset>

    <div class="side-panel-buttons">
      <button class="primary" data-action="save-descriptor">Сохранить</button>
      <button data-action="copy-generate-command">Скопировать команду</button>
      <button data-action="close-editor">Отмена</button>
    </div>
  </div>

  <!-- Кластеризация -->
  <div role="tabpanel" id="cluster-panel" data-active="false">
    <h2>Кластеризация</h2>

    <div class="form-group">
      <label for="cluster-k">Количество кластеров (K)</label>
      <input type="number" id="cluster-k" placeholder="Автоматический" min="2">
    </div>

    <button class="primary" data-action="run-cluster">Запустить кластеризацию</button>

    <div id="cluster-status" class="status-message"></div>

    <div class="form-group">
      <label for="cluster-prompt">Контекст для Claude</label>
      <textarea id="cluster-prompt" readonly placeholder="Появится после запуска кластеризации"></textarea>
      <button id="copy-cluster-btn" data-action="copy-cluster-context" disabled>Скопировать</button>
    </div>
  </div>

  <div class="footer" id="footer">
    <button class="primary" data-action="mark-done">Завершить сессию</button>
  </div>

  <script nonce="">
    let currentOffset = 0;
    let currentLimit = 20;
    let currentFamilyId = null;
    let currentRefInPanel = null;
    let moodChips = [];
    let sourceReadiness = {};

    // Plural helper for Russian
    function pluralRefs(count) {
      if (count === 1) return 'референс';
      if (count >= 2 && count <= 4) return 'референса';
      return 'референсов';
    }

    // Status badge translation
    function statusBadgeText(status) {
      const map = {
        'proposed': 'предложено',
        'approved': 'утверждено',
        'discarded': 'отклонено',
        'merged': 'слито'
      };
      return map[status] || status;
    }

    // === Tab navigation ===
    document.querySelectorAll('[role="tab"]').forEach((tab, index) => {
      tab.addEventListener('click', () => switchTab(tab));
      tab.addEventListener('keydown', (e) => {
        const tabs = document.querySelectorAll('[role="tab"]');
        let targetTab;
        if (e.key === 'ArrowRight') {
          targetTab = tabs[(index + 1) % tabs.length];
        } else if (e.key === 'ArrowLeft') {
          targetTab = tabs[(index - 1 + tabs.length) % tabs.length];
        }
        if (targetTab) {
          e.preventDefault();
          switchTab(targetTab);
        }
      });
    });

    function switchTab(tab) {
      if (typeof closeRefPanel === 'function') closeRefPanel();
      closeEditor();
      document.querySelectorAll('[role="tab"]').forEach(t => {
        t.setAttribute('aria-selected', 'false');
        t.setAttribute('tabindex', '-1');
      });
      document.querySelectorAll('[role="tabpanel"]').forEach(p => {
        p.setAttribute('data-active', 'false');
      });

      tab.setAttribute('aria-selected', 'true');
      tab.setAttribute('tabindex', '0');
      tab.focus();

      const panelId = tab.getAttribute('aria-controls');
      document.getElementById(panelId).setAttribute('data-active', 'true');

      if (panelId === 'families-panel') loadFamilies();
      if (panelId === 'gather-panel') loadSources();
    }

    // === Status messages ===
    async function apiError(res, fallback) {
      try {
        const data = await res.json();
        if (data && typeof data.error === 'string') return data.error;
      } catch {}
      return fallback;
    }

    function showStatus(elementId, message, type = 'error') {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `status-message show ${type}`;
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    // === Delegated event listeners ===
    document.addEventListener('click', async (e) => {
      const action = e.target.getAttribute('data-action');

      if (action === 'search-refs') {
        currentOffset = 0;
        await loadReferences();
      } else if (action === 'load-more-refs') {
        currentOffset += currentLimit;
        await loadReferences();
      } else if (action === 'import-refs') {
        await importReferences();
      } else if (action === 'add-local-files') {
        await addLocalFiles();
      } else if (action === 'add-mood-chip') {
        addMoodChip();
      } else if (action === 'save-descriptor') {
        await saveDescriptor();
      } else if (action === 'copy-generate-command') {
        const familyId = e.target.getAttribute('data-id') || currentFamilyId;
        await copyGenerateCommand(familyId);
      } else if (action === 'close-editor') {
        closeEditor();
      } else if (action === 'run-cluster') {
        await runCluster();
      } else if (action === 'copy-cluster-context') {
        await copyClusterContext();
      } else if (action === 'mark-done') {
        await markDone();
      } else if (action === 'close-ref-panel') {
        closeRefPanel();
      } else if (action === 'add-ref-tag') {
        await addRefTag();
      } else if (action === 'discard-ref') {
        await discardRef();
      } else if (action === 'edit-family') {
        await editFamily(e.target.getAttribute('data-id'));
      } else if (action === 'family-approve') {
        await decideFamily(e.target.getAttribute('data-id'), 'approve');
      } else if (action === 'family-discard') {
        await decideFamily(e.target.getAttribute('data-id'), 'discard');
      } else if (action === 'family-merge') {
        const familyId = e.target.getAttribute('data-id');
        const select = e.target.previousElementSibling;
        const mergeInto = select.value;
        if (mergeInto) {
          await decideFamily(familyId, 'merge', mergeInto);
          select.value = '';
        }
      } else if (action === 'remove-mood-chip') {
        const index = parseInt(e.target.getAttribute('data-index'));
        moodChips.splice(index, 1);
        updateMoodChips();
      }
    });

    // === Change listeners for exemplar checkboxes ===
    document.addEventListener('change', async (e) => {
      if (e.target.classList.contains('exemplar-toggle')) {
        const familyId = e.target.getAttribute('data-family-id');
        const refId = e.target.getAttribute('data-ref-id');
        await updateExemplar(familyId, refId, e.target.checked);
      }
    });

    // === Sources and Refs ===
    function updateSourceHint() {
      const select = document.getElementById('import-source');
      const hint = document.getElementById('import-source-hint');
      const btn = document.querySelector('[data-action="import-refs"]');
      const info = sourceReadiness[select.value];
      if (!info) { hint.hidden = true; return; }
      const parts = [];
      if (info.kind === 'local-only') parts.push('Локальный источник: работает под вашей сессией, риск блокировки аккаунта на вас (ADR-007).');
      if (!info.ready && info.reason) parts.push(info.reason);
      if (parts.length > 0) {
        hint.textContent = parts.join(' ');
        hint.hidden = false;
      } else {
        hint.hidden = true;
      }
      if (btn) btn.disabled = !info.ready;
    }

    document.getElementById('import-source').addEventListener('change', updateSourceHint);

    async function loadSources() {
      try {
        const res = await fetch('./sources');
        if (!res.ok) throw new Error(await apiError(res, 'Failed to load sources'));
        const data = await res.json();

        sourceReadiness = {};

        const sourceSelect = document.getElementById('import-source');
        const refSourceSelect = document.getElementById('refs-source');

        // Clear and populate sourceSelect
        sourceSelect.innerHTML = '';
        const addSourceOption = (s) => {
          const ready = s.readiness === 'ready';
          sourceReadiness[s.id] = { ready, kind: s.kind, reason: s.reason || '' };
          const option = document.createElement('option');
          option.value = s.id;
          let label = s.name;
          if (s.kind === 'local-only') label += ' — локальный';
          if (s.readiness === 'needs-config') label += ' — нужен ключ';
          if (s.readiness === 'gated') label += ' — выключен';
          option.textContent = label;
          option.disabled = !ready;
          sourceSelect.appendChild(option);
        };
        data.cleanImporters.forEach(addSourceOption);
        (data.localImporters || []).forEach(addSourceOption);
        const firstReady = Array.from(sourceSelect.options).find(o => !o.disabled);
        if (firstReady) sourceSelect.value = firstReady.value;
        updateSourceHint();

        // Clear and populate refSourceSelect
        refSourceSelect.innerHTML = '';
        const allOption = document.createElement('option');
        allOption.value = '';
        allOption.textContent = 'Все';
        refSourceSelect.appendChild(allOption);

        data.cleanImporters.forEach(s => {
          const option = document.createElement('option');
          option.value = s.id;
          option.textContent = s.name;
          refSourceSelect.appendChild(option);
        });
      } catch (err) {
        console.error('Error loading sources:', err);
      }
    }

    async function loadReferences() {
      const source = document.getElementById('refs-source').value || '';
      const family = document.getElementById('refs-family').value || '';
      const q = document.getElementById('refs-query').value || '';

      const params = new URLSearchParams({
        limit: currentLimit.toString(),
        offset: currentOffset.toString(),
      });
      if (source) params.append('source', source);
      if (family) params.append('family', family);
      if (q) params.append('q', q);

      try {
        const res = await fetch(`./refs?${params}`);
        if (!res.ok) throw new Error(await apiError(res, 'Failed to load references'));
        const data = await res.json();

        const grid = document.getElementById('refs-grid');
        if (currentOffset === 0) {
          grid.innerHTML = '';
        }

        data.items.forEach(ref => {
          const card = document.createElement('div');
          card.className = 'ref-card';

          const thumb = document.createElement('div');
          thumb.className = 'ref-thumb';
          const img = document.createElement('img');
          img.src = ref.previewUrl;
          img.alt = ref.sourceRef;
          img.loading = 'lazy';
          thumb.appendChild(img);
          card.appendChild(thumb);

          // Add caption with sourceRef and source+family
          const caption = document.createElement('div');
          caption.className = 'ref-caption';
          const basename = ref.sourceRef.split('/').pop().split('.')[0];
          const familyText = ref.familySlug ? ` / ${ref.familySlug}` : '';
          // Show: line 1 = basename, line 2 = source + family (combined as text-overflow)
          caption.textContent = basename + '  |  ' + ref.source + familyText;
          card.appendChild(caption);

          card.addEventListener('click', () => showRefPanel(ref));
          grid.appendChild(card);
        });

        const moreBtn = document.getElementById('refs-more');
        if (data.items.length < data.total) {
          moreBtn.classList.add('show');
        } else {
          moreBtn.classList.remove('show');
        }

        // Empty state
        if (grid.innerHTML === '') {
          const empty = document.createElement('div');
          empty.style.setProperty('padding', '40px 20px');
          empty.style.setProperty('text-align', 'center');
          empty.style.setProperty('color', 'var(--text-secondary)');
          empty.textContent = 'Ничего не найдено. Измените фильтры или загляните во вкладку «Собрать».';
          grid.appendChild(empty);
        }
      } catch (err) {
        showStatus('refs-status', err.message, 'error');
      }
    }

    async function showRefPanel(ref) {
      currentRefInPanel = ref;
      const panel = document.getElementById('ref-panel');
      if (!panel) createRefPanel();

      const refPanel = document.getElementById('ref-panel');
      refPanel.innerHTML = '';

      // Header
      const header = document.createElement('div');
      header.className = 'side-panel-header';
      const title = document.createElement('h3');
      title.textContent = ref.sourceRef;
      const closeBtn = document.createElement('button');
      closeBtn.className = 'side-panel-close';
      closeBtn.textContent = '×';
      closeBtn.setAttribute('data-action', 'close-ref-panel');
      header.appendChild(title);
      header.appendChild(closeBtn);
      refPanel.appendChild(header);

      // Preview image
      const preview = document.createElement('img');
      preview.className = 'preview';
      preview.src = ref.previewUrl;
      preview.alt = 'preview';
      refPanel.appendChild(preview);

      // Palette (hidden - colors would violate CSP without inline styles)
      // ref.palette is available but not displayed due to CSP restrictions

      // Source link
      const linkDiv = document.createElement('div');
      const link = document.createElement('a');
      try {
        const urlObj = new URL(ref.pageUrl);
        if (urlObj.protocol === 'https:' || urlObj.protocol === 'http:') {
          link.href = ref.pageUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Источник';
          linkDiv.appendChild(link);
          refPanel.appendChild(linkDiv);
        }
      } catch {
        // Invalid URL, skip link
      }

      // Tags section
      const formGroup = document.createElement('div');
      formGroup.className = 'form-group';
      const label = document.createElement('label');
      label.textContent = 'Теги';
      formGroup.appendChild(label);

      const tagsDisplay = document.createElement('div');
      tagsDisplay.id = 'ref-tags-display';
      tagsDisplay.className = 'chips';
      formGroup.appendChild(tagsDisplay);

      const inputRow = document.createElement('div');
      inputRow.className = 'ref-tags-input-row';
      const tagInput = document.createElement('input');
      tagInput.type = 'text';
      tagInput.id = 'ref-tag-input';
      tagInput.placeholder = 'Добавить тег';
      const addTagBtn = document.createElement('button');
      addTagBtn.textContent = 'Добавить';
      addTagBtn.setAttribute('data-action', 'add-ref-tag');
      inputRow.appendChild(tagInput);
      inputRow.appendChild(addTagBtn);
      formGroup.appendChild(inputRow);
      refPanel.appendChild(formGroup);

      // Action buttons
      const buttonGroup = document.createElement('div');
      buttonGroup.className = 'button-group full';
      const discardBtn = document.createElement('button');
      discardBtn.className = 'danger';
      discardBtn.textContent = 'Скрыть';
      discardBtn.setAttribute('data-action', 'discard-ref');
      buttonGroup.appendChild(discardBtn);
      refPanel.appendChild(buttonGroup);

      refPanel.classList.add('active');
      updateRefTags();
    }

    function createRefPanel() {
      const panel = document.createElement('div');
      panel.id = 'ref-panel';
      panel.className = 'side-panel';
      document.body.appendChild(panel);
    }

    function closeRefPanel() {
      const panel = document.getElementById('ref-panel');
      if (panel) panel.classList.remove('active');
    }

    async function addRefTag() {
      if (!currentRefInPanel) return;
      const input = document.getElementById('ref-tag-input');
      const tag = input.value.trim();
      if (!tag) return;

      try {
        const res = await fetch(`./ref/${currentRefInPanel.id}/tags`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tags: [tag] }),
        });
        if (!res.ok) throw new Error(await apiError(res, 'Failed to add tag'));
        input.value = '';
        updateRefTags();
      } catch (err) {
        console.error('Error adding tag:', err);
      }
    }

    async function updateRefTags() {
      if (!currentRefInPanel) return;
      try {
        const res = await fetch(`./ref/${currentRefInPanel.id}`);
        if (!res.ok) return;
        const ref = await res.json();
        const display = document.getElementById('ref-tags-display');
        display.innerHTML = '';
        (ref.tags || []).forEach(tag => {
          const chip = document.createElement('div');
          chip.className = 'chip';
          chip.textContent = tag;
          display.appendChild(chip);
        });
      } catch (err) {
        console.error('Error updating tags:', err);
      }
    }

    async function discardRef() {
      if (!currentRefInPanel) return;
      try {
        const res = await fetch(`./ref/${currentRefInPanel.id}/discard`, { method: 'POST' });
        if (!res.ok) throw new Error(await apiError(res, 'Failed to discard'));
        closeRefPanel();
        await loadReferences();
      } catch (err) {
        console.error('Error discarding:', err);
      }
    }

    // === Import ===
    async function importReferences() {
      const source = document.getElementById('import-source').value;
      const query = document.getElementById('import-query').value || '';
      const collection = document.getElementById('import-collection').value || '';
      const limit = parseInt(document.getElementById('import-limit').value) || 30;

      if (!source) {
        showStatus('import-status', 'Выберите источник', 'error');
        return;
      }

      try {
        const payload = { source, query, limit };
        if (collection) payload.collection = collection;

        const res = await fetch('./import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(await apiError(res, 'Import failed'));
        const data = await res.json();

        // Show detailed results
        const statusEl = document.getElementById('import-status');
        statusEl.innerHTML = '';

        const summary = document.createElement('div');
        summary.textContent = `✓ Импортировано: ${data.ingested}, дубликатов: ${data.dedup}, ошибок: ${data.failed}`;
        statusEl.appendChild(summary);

        if (data.results && data.results.length > 0) {
          const list = document.createElement('div');
          list.style.setProperty('margin-top', 'var(--spacing-sm)');
          list.style.setProperty('font-size', '12px');
          const itemsToShow = data.results.slice(0, 20);
          itemsToShow.forEach(r => {
            const item = document.createElement('div');
            item.style.setProperty('padding', 'var(--spacing-xs)');
            item.style.setProperty('border-bottom', '1px solid var(--border)');
            const reason = r.reason ? ` — ${r.reason}` : '';
            item.textContent = `${r.status}${reason}`;
            list.appendChild(item);
          });
          statusEl.appendChild(list);
        }

        statusEl.className = 'status-message show success';
        setTimeout(() => statusEl.classList.remove('show'), 5000);
      } catch (err) {
        showStatus('import-status', err.message, 'error');
      }
    }

    async function addLocalFiles() {
      const paths = document.getElementById('local-paths').value.split('\n').filter(p => p.trim());
      if (!paths.length) {
        showStatus('local-status', 'Укажите пути', 'error');
        return;
      }

      try {
        const res = await fetch('./add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paths }),
        });
        if (!res.ok) throw new Error(await apiError(res, 'Add failed'));
        const data = await res.json();
        showStatus('local-status', `Добавлено: ${data.ingested}, дубликатов: ${data.dedup}, ошибок: ${data.failed}`, 'success');
        document.getElementById('local-paths').value = '';
      } catch (err) {
        showStatus('local-status', err.message, 'error');
      }
    }

    // === Families ===
    async function loadFamilies() {
      try {
        const res = await fetch('./state');
        if (!res.ok) throw new Error(await apiError(res, 'Failed to load state'));
        const data = await res.json();

        const list = document.getElementById('families-list');
        list.innerHTML = '';

        data.families.forEach(f => {
          const card = document.createElement('div');
          card.className = 'family-card';

          // Header
          const header = document.createElement('div');
          header.className = 'family-header';

          const title = document.createElement('div');
          title.className = 'family-title';
          const name = document.createElement('div');
          name.className = 'family-name';
          name.textContent = f.name;
          const slug = document.createElement('div');
          slug.className = 'family-slug';
          slug.textContent = f.slug || f.id.slice(0, 8);
          title.appendChild(name);
          title.appendChild(slug);

          const status = document.createElement('span');
          status.className = `family-status ${f.status}`;
          status.textContent = statusBadgeText(f.status);

          header.appendChild(title);
          header.appendChild(status);
          card.appendChild(header);

          // Size
          const sizeEl = document.createElement('div');
          sizeEl.className = 'family-size';
          sizeEl.textContent = `${f.size || 0} ${pluralRefs(f.size || 0)}`;
          card.appendChild(sizeEl);

          // Summary
          const summary = document.createElement('div');
          summary.className = 'family-summary';
          if (f.summary) {
            summary.textContent = f.summary;
          } else {
            summary.textContent = 'Описание не заполнено';
            summary.style.setProperty('color', 'var(--text-secondary)');
          }
          card.appendChild(summary);

          // Palette swatches (from style.setProperty, which is allowed)
          if (f.palette && f.palette.length > 0) {
            const palette = document.createElement('div');
            palette.className = 'family-palette';
            f.palette.forEach(color => {
              const item = document.createElement('div');
              item.className = 'family-palette-item';
              item.style.setProperty('background-color', color);
              palette.appendChild(item);
            });
            card.appendChild(palette);
          }

          // Exemplars
          if (f.exemplars && f.exemplars.length > 0) {
            const exemplars = document.createElement('div');
            exemplars.className = 'family-exemplars';
            f.exemplars.forEach(ex => {
              const img = document.createElement('img');
              img.className = 'family-exemplar-img';
              img.src = ex.previewUrl;
              img.alt = 'exemplar';
              img.loading = 'lazy';
              exemplars.appendChild(img);
            });
            card.appendChild(exemplars);
          }

          // Action buttons in order: approve → merge → discard → copy-command → edit
          const actions = document.createElement('div');
          actions.className = 'family-actions';

          const approveBtn = document.createElement('button');
          approveBtn.textContent = 'Утвердить';
          approveBtn.className = 'primary';
          approveBtn.setAttribute('data-action', 'family-approve');
          approveBtn.setAttribute('data-id', f.id);
          actions.appendChild(approveBtn);

          // Merge select + button (only if not merged)
          if (f.status !== 'merged') {
            const mergeContainer = document.createElement('div');
            mergeContainer.className = 'merge-group';

            const mergeSelect = document.createElement('select');
            mergeSelect.setAttribute('data-family-id', f.id);
            mergeSelect.setAttribute('data-action-type', 'merge-target');
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = 'Слить в...';
            mergeSelect.appendChild(emptyOpt);

            data.families.forEach(other => {
              if (other.id !== f.id && other.status !== 'merged') {
                const opt = document.createElement('option');
                opt.value = other.id;
                opt.textContent = other.name;
                mergeSelect.appendChild(opt);
              }
            });
            mergeContainer.appendChild(mergeSelect);

            const mergeBtn = document.createElement('button');
            mergeBtn.textContent = 'Слить';
            mergeBtn.setAttribute('data-action', 'family-merge');
            mergeBtn.setAttribute('data-id', f.id);
            mergeContainer.appendChild(mergeBtn);

            actions.appendChild(mergeContainer);
          }

          const discardBtn = document.createElement('button');
          discardBtn.textContent = 'Отклонить';
          discardBtn.className = 'danger';
          discardBtn.setAttribute('data-action', 'family-discard');
          discardBtn.setAttribute('data-id', f.id);
          actions.appendChild(discardBtn);

          // Add command button for approved families
          if (f.status === 'approved') {
            const cmdBtn = document.createElement('button');
            cmdBtn.textContent = 'Команда генерации';
            cmdBtn.setAttribute('data-action', 'copy-generate-command');
            cmdBtn.setAttribute('data-id', f.id);
            actions.appendChild(cmdBtn);
          }

          const editBtn = document.createElement('button');
          editBtn.textContent = 'Редактировать';
          editBtn.setAttribute('data-action', 'edit-family');
          editBtn.setAttribute('data-id', f.id);
          actions.appendChild(editBtn);

          card.appendChild(actions);
          list.appendChild(card);
        });

        // Empty state for families
        if (data.families.length === 0) {
          const empty = document.createElement('div');
          empty.style.setProperty('padding', '40px 20px');
          empty.style.setProperty('text-align', 'center');
          empty.style.setProperty('color', 'var(--text-secondary)');
          empty.textContent = 'Семейств пока нет — запустите кластеризацию или добавьте референсы.';
          list.appendChild(empty);
        }

        // Update family select in refs
        const familySelect = document.getElementById('refs-family');
        const oldValue = familySelect.value;
        familySelect.innerHTML = '';

        const allOption = document.createElement('option');
        allOption.value = '';
        allOption.textContent = 'Все';
        familySelect.appendChild(allOption);

        data.families.forEach(f => {
          const option = document.createElement('option');
          option.value = f.slug || f.id;
          option.textContent = f.name;
          familySelect.appendChild(option);
        });

        familySelect.value = oldValue;
      } catch (err) {
        console.error('Error loading families:', err);
      }
    }

    async function editFamily(familyId) {
      try {
        const res = await fetch(`./family/${familyId}`);
        if (!res.ok) throw new Error(await apiError(res, 'Failed to load family'));
        const family = await res.json();

        currentFamilyId = familyId;
        const descriptor = family.descriptor || {};

        document.getElementById('editor-name').value = family.name;
        document.getElementById('editor-slug').value = family.slug || '';
        document.getElementById('editor-summary').value = descriptor.summary || '';
        document.getElementById('editor-prompt').value = descriptor.prompt_fragment || '';
        document.getElementById('editor-negative').value = descriptor.negative_fragment || '';

        moodChips = descriptor.mood || [];
        updateMoodChips();

        document.getElementById('editor-density').value = descriptor.dials?.visualDensity || 0.5;
        document.getElementById('editor-variance').value = descriptor.dials?.designVariance || 0.5;
        document.getElementById('editor-decor').value = descriptor.dials?.decorLevel || 0.5;
        document.getElementById('editor-symmetry').value = descriptor.dials?.symmetry || 0.5;

        document.getElementById('editor-spacing-density').value = descriptor.spacing?.density || 'balanced';
        document.getElementById('editor-motion-char').value = descriptor.motion?.character || 'calm';

        updateRangeDisplays();

        // Load exemplars
        const exemplarsGrid = document.getElementById('editor-exemplars');
        exemplarsGrid.innerHTML = '';
        family.members.forEach((m, idx) => {
          const label = document.createElement('label');
          label.className = 'exemplar-label';

          const preview = document.createElement('div');
          preview.className = 'exemplar-preview';
          const img = document.createElement('img');
          img.src = m.previewUrl;
          img.alt = 'exemplar';
          img.loading = 'lazy';
          preview.appendChild(img);
          label.appendChild(preview);

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'exemplar-toggle';
          checkbox.checked = m.isExemplar;
          checkbox.setAttribute('data-family-id', familyId);
          checkbox.setAttribute('data-ref-id', m.refId);
          label.appendChild(checkbox);

          const text = document.createElement('span');
          text.className = 'sr-only';
          text.textContent = `Образец ${idx + 1}`;
          label.appendChild(text);

          exemplarsGrid.appendChild(label);
        });

        document.getElementById('family-editor-panel').classList.add('active');
        updateFooterVisibility();
      } catch (err) {
        console.error('Error editing family:', err);
      }
    }

    function updateRangeDisplays() {
      ['density', 'variance', 'decor', 'symmetry'].forEach(name => {
        const input = document.getElementById(`editor-${name}`);
        const display = document.getElementById(`editor-${name}-value`);
        if (input && display) {
          display.textContent = input.value;
          input.addEventListener('input', () => {
            display.textContent = input.value;
          });
        }
      });
    }

    function updateFooterVisibility() {
      const footer = document.getElementById('footer');
      const panel = document.getElementById('family-editor-panel');
      if (panel && panel.classList.contains('active')) {
        footer.style.display = 'none';
      } else {
        footer.style.display = 'flex';
      }
    }

    function updateMoodChips() {
      const container = document.getElementById('editor-mood-chips');
      container.innerHTML = '';
      moodChips.forEach((mood, i) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        const text = document.createTextNode(mood);
        chip.appendChild(text);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'chip-remove';
        removeBtn.textContent = '×';
        removeBtn.setAttribute('data-action', 'remove-mood-chip');
        removeBtn.setAttribute('data-index', i.toString());
        chip.appendChild(removeBtn);

        container.appendChild(chip);
      });
    }

    function addMoodChip() {
      const input = document.getElementById('editor-mood-input');
      const mood = input.value.trim();
      if (mood && !moodChips.includes(mood)) {
        moodChips.push(mood);
        input.value = '';
        updateMoodChips();
      }
    }

    async function updateExemplar(familyId, refId, isExemplar) {
      try {
        const res = await fetch(`./family/${familyId}/exemplar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refId, isExemplar }),
        });
        if (!res.ok) throw new Error(await apiError(res, 'Failed to update exemplar'));
      } catch (err) {
        console.error('Error updating exemplar:', err);
      }
    }

    async function saveDescriptor() {
      if (!currentFamilyId) return;

      const newName = document.getElementById('editor-name').value.trim();
      const newSlug = document.getElementById('editor-slug').value.trim();

      try {
        // If both name and slug are provided, send rename first
        if (newName && newSlug) {
          // Validate slug format
          if (!/^[a-z0-9-]*$/.test(newSlug)) {
            throw new Error('Слаг должен содержать только буквы, цифры и дефисы');
          }

          const res = await fetch('./decide', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              familyId: currentFamilyId,
              action: 'rename',
              name: newName,
              slug: newSlug
            }),
          });
          if (!res.ok) {
            const text = await res.text();
            const err = JSON.parse(text);
            throw new Error(err.error || 'Failed to rename');
          }
        } else if (newName || newSlug) {
          throw new Error('Укажите обе опции: название и слаг');
        }

        const descriptor = {
          summary: document.getElementById('editor-summary').value,
          mood: moodChips.length > 0 ? moodChips : undefined,
          dials: {
            visualDensity: parseFloat(document.getElementById('editor-density').value),
            designVariance: parseFloat(document.getElementById('editor-variance').value),
            decorLevel: parseFloat(document.getElementById('editor-decor').value),
            symmetry: parseFloat(document.getElementById('editor-symmetry').value),
          },
          spacing: {
            density: document.getElementById('editor-spacing-density').value,
          },
          motion: {
            character: document.getElementById('editor-motion-char').value,
          },
          prompt_fragment: document.getElementById('editor-prompt').value,
          negative_fragment: document.getElementById('editor-negative').value || undefined,
        };

        const res = await fetch(`./family/${currentFamilyId}/descriptor`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(descriptor),
        });
        if (!res.ok) {
          const text = await res.text();
          const err = JSON.parse(text);
          throw new Error(err.error || 'Failed to save');
        }
        closeEditor();
        console.log('About to reload families after save');
        await loadFamilies();
        console.log('Families reloaded after save');
        showStatus('families-panel', 'Сохранено', 'success');
      } catch (err) {
        console.error('Error in saveDescriptor:', err);
        showStatus('families-panel', err.message, 'error');
      }
    }

    async function copyGenerateCommand(familyId = null) {
      const fid = familyId || currentFamilyId;
      if (!fid) return;
      try {
        const res = await fetch(`./generate-command/${fid}`);
        if (!res.ok) throw new Error(await apiError(res, 'Failed to get command'));
        const data = await res.json();

        try {
          await navigator.clipboard.writeText(data.command);
          showStatus('families-panel', 'Команда скопирована', 'success');
        } catch {
          const textarea = document.createElement('textarea');
          textarea.value = data.command;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showStatus('families-panel', 'Команда скопирована', 'success');
        }
      } catch (err) {
        showStatus('families-panel', err.message, 'error');
      }
    }

    function closeEditor() {
      const panel = document.getElementById('family-editor-panel');
      if (panel) panel.classList.remove('active');
      currentFamilyId = null;
      updateFooterVisibility();
    }

    async function decideFamily(familyId, action, mergeInto = null) {
      try {
        const payload = { familyId, action };
        if (mergeInto) payload.mergeInto = mergeInto;
        const res = await fetch('./decide', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(await apiError(res, 'Failed to decide'));
        await loadFamilies();
      } catch (err) {
        console.error('Error deciding family:', err);
      }
    }

    // === Clustering ===
    async function runCluster() {
      const k = document.getElementById('cluster-k').value;
      try {
        const res = await fetch('./cluster', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ k: k ? parseInt(k) : undefined }),
        });
        if (!res.ok) throw new Error(await apiError(res, 'Clustering failed'));
        const data = await res.json();
        showStatus('cluster-status', `Создано ${data.families.length} кластеров`, 'success');
        await loadFamilies();
        // Switch to families tab
        const familiesTab = document.querySelector('[data-tab="families"]');
        if (familiesTab) switchTab(familiesTab);
      } catch (err) {
        showStatus('cluster-status', err.message, 'error');
      }
    }

    async function copyClusterContext() {
      try {
        const res = await fetch('./propose');
        if (!res.ok) throw new Error(await apiError(res, 'Failed to get context'));
        const data = await res.json();
        const text = JSON.stringify(data, null, 2);

        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        document.getElementById('cluster-prompt').value = text;
        document.getElementById('copy-cluster-btn').disabled = false;
        showStatus('cluster-status', 'Контекст скопирован', 'success');
      } catch (err) {
        showStatus('cluster-status', err.message, 'error');
      }
    }

    // === Done ===
    async function markDone() {
      try {
        const res = await fetch('./done', { method: 'POST' });
        if (!res.ok) throw new Error(await apiError(res, 'Failed'));
        showStatus('families-panel', 'Завершено!', 'success');
      } catch (err) {
        console.error('Error:', err);
      }
    }

    // === Init ===
    loadSources();
    loadReferences();
    loadFamilies();
    updateFooterVisibility();
  </script>
</body>
</html>
