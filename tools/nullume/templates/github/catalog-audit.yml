# Copy this file to .github/workflows/nullume-catalog-audit.yml in your repo
# Updates working-directory to "." (this package is a git submodule or installed via npm)

name: Nullume — аудит каталога kie.ai

# Раз в неделю сверяет vendored каталог data/*.json
# с живой документацией docs.kie.ai. Секреты не нужны — запрос анонимный.
# При расхождении (exit 1) заводит issue с выводом аудита.

on:
  schedule:
    - cron: '0 6 * * 1' # понедельник, 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Аудит каталога
        id: audit
        run: |
          set +e
          npm run audit:catalog > audit-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat audit-output.txt

      - name: Приложить вывод аудита артефактом
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: nullume-catalog-audit-output
          path: audit-output.txt
          retention-days: 14

      - name: Создать issue при расхождении
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Nullume: каталог kie.ai разошёлся с документацией';
            const output = fs.readFileSync('audit-output.txt', 'utf-8');

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            if (existing.data.total_count > 0) {
              console.log('Открытый issue уже есть, новый не создаю.');
              return;
            }

            const body = [
              'Плановый аудит каталога Nullume нашёл расхождение с docs.kie.ai.',
              '',
              '```',
              output.slice(0, 60000),
              '```',
              '',
              `Прогон: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
