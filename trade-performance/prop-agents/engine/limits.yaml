# МЕНЯЕТ ТОЛЬКО ГЕРМАН. Агентам и улучшателям недоступно: risk.py читает файл только на чтение.
# Лимиты стратегий (наши, поверх правил пропа). Берётся более строгий из пары «профиль пропа / стратегия».
# Стартовые значения — утверждает Герман.

kill_switch: false                 # глобальный стоп всей торговли
kill_switch_file: KILL_SWITCH      # если файл engine/KILL_SWITCH существует — тоже стоп (для Сторожа)

strategies:
  smc-btc:
    risk_pct: 0.5                  # риск на сделку, % от equity
    min_rr: 2.0                    # детектор даёт RR 1:2
    max_leverage: 5
    daily_loss_pct: 2.0            # от базы начала дня (метод — из профиля пропа)
    max_drawdown_pct: 5.0          # от начального баланса
    drawdown_type: static
    max_positions: 1
    max_same_side: 1
    max_trades_per_day: 4
    loss_streak: 3                 # столько убытков подряд → пауза
    pause_minutes: 240
    whitelist: [BTCUSDT]

# Шаг лота и мин. объём. Сверить со спецификацией площадки перед боем.
instruments:
  BTCUSDT:
    lot_step: 0.001
    min_qty: 0.001
