# Simba — временная тест-версия на IP 147.45.157.11 (HTTP, без домена).
# Один сервер раздаёт: / (магазин), /admin (админка, Basic Auth), /api (Fastify).
# Весь сайт закрыт от поисковиков (X-Robots-Tag). При переезде на домен —
# добавить server_name simbazoo.ru, HTTPS (certbot) и снять noindex.
#
# Установка: скопировать в /etc/nginx/sites-available/simba,
# слинковать в sites-enabled, nginx -t && systemctl reload nginx.

server {
    listen 80 default_server;
    server_name 147.45.157.11 _;

    # Закрываем ВЕСЬ сайт от индексации (страховка №1, уровень сервера).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Логи
    access_log /var/log/nginx/simba.access.log;
    error_log  /var/log/nginx/simba.error.log;

    # Магазин (client SPA)
    root /var/www/simba/client;
    index index.html;

    # API → Fastify на localhost:3000 (роуты уже с префиксом /api, не срезаем)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, а не $proxy_add_x_forwarded_for: второй дописывает
        # адрес к тому, что прислал клиент, и подделанный заголовок доезжает
        # до сервера. Здесь клиент — всегда сам покупатель, цепочки прокси нет.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        client_max_body_size 20m;
    }

    # Админка (admin SPA) — под Basic Auth, base '/admin/'
    location = /admin { return 301 /admin/; }
    location /admin/ {
        auth_basic "Simba Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-simba;
        alias /var/www/simba/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Оболочка SPA всегда свежая: после выкатки браузер не должен держать старый бандл
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Магазин — SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
