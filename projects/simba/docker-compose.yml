services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: simba
      POSTGRES_USER: simba
      POSTGRES_PASSWORD: simba_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: simba
      MINIO_ROOT_PASSWORD: simba_dev
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
