# Медиа видеоотзывов. Подключается в server-блоках строкой include (см. nginx-perfect-skin.conf).
# Снаружи файл запрашивает приложение: оно решает, можно ли показать ролик, и отвечает X-Accel-Redirect.
# Сам файл Nginx берёт по внутреннему адресу /_protected/, снаружи он недоступен.

location /uploads/video-reviews/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Каталог — тот же, что PS_VIDEO_REVIEWS_DIR. Корень сайта (client/) его не покрывает, документы согласий здесь не лежат.
location /_protected/video-reviews/ {
    internal;
    alias /var/www/perfect-skin/uploads/video-reviews/;
    types { video/mp4 mp4; video/webm webm; image/jpeg jpg; }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
