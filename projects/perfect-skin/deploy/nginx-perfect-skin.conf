# Perfect Skin — тест-версия на new.perfect-skin.shop (HTTPS будет после certbot).
# Один сервер раздаёт: / (SPA клиента с админкой внутри), /api/v1 (Fastify).
# Весь сайт закрыт от поисковиков (X-Robots-Tag: noindex) — это копия боевого магазина,
# попадание её в поиск навредит SEO основного сайта.
#
# После переезда на боевой домен perfect-skin.shop:
# - Поменять server_name
# - Выпустить сертификат: certbot --nginx -d perfect-skin.shop
# - Пересобрать клиент с VITE_API_URL=https://perfect-skin.shop
# - Поменять PS_CORS_ORIGIN=https://perfect-skin.shop
# - Снять X-Robots-Tag: noindex (убрать строку ниже или поменять на allowall)
#
# Установка: скопировать в /etc/nginx/sites-available/perfect-skin,
# слинковать в sites-enabled, удалить default, nginx -t && systemctl reload nginx.

server {
    listen 80 default_server;
    server_name new.perfect-skin.shop;

    # СТРАХОВКА: весь сайт закрыт от индексации (уровень сервера).
    # Снять при переезде на боевой домен.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Логи
    access_log /var/log/nginx/perfect-skin.access.log;
    error_log  /var/log/nginx/perfect-skin.error.log;

    # Статика клиента (SPA)
    root /var/www/perfect-skin/client;
    index index.html;

    # API → Fastify на localhost:3000 (роуты уже с префиксом /api/v1, не срезаем)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, а не $proxy_add_x_forwarded_for: второй дописывает
        # адрес к тому, что прислал клиент, и подделанный заголовок доезжает
        # до сервера. Здесь клиент — всегда сам покупатель, цепочки прокси нет.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Оболочка SPA всегда свежая: после выкатки браузер не должен держать старый бандл
    #
    # X-Robots-Tag повторён здесь и ниже намеренно: свой add_header во вложенном
    # блоке отменяет ВСЕ унаследованные, а не дополняет их. Из-за этого главная
    # страница уходила без запрета индексации — она отдаётся через /index.html.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Assets: долгий кэш (хешируются в имени)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # SPA fallback для всех остальных маршрутов
    location / {
        try_files $uri /index.html;
    }

    # gzip для текстовых типов
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;
}
