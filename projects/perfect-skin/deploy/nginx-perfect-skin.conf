# Perfect Skin — тест-версия на new.perfect-skin.shop (HTTPS будет после certbot).
# Один сервер раздаёт: статику клиента (файлы с диска), HTML-страницы и robots/sitemap (Fastify,
# он подставляет мету и разметку в шаблон клиента), /api/v1 (Fastify).
# Запрет индексации — один переключатель: map $ps_robots_tag в сниппете perfect-skin-indexing.conf.
# Открытие индексации — deploy/DEPLOY.md, §4.4.
#
# Установка: сниппеты в /etc/nginx/snippets/ (их кладёт bootstrap), этот файл — в sites-available,
# слинковать в sites-enabled, удалить default, nginx -t && systemctl reload nginx.

include /etc/nginx/snippets/perfect-skin-indexing.conf;

server {
    listen 80 default_server;
    server_name new.perfect-skin.shop;

    # Запрет индексации для всего сайта; значение — из map в сниппете индексации.
    # Locations с собственным add_header отменяют этот заголовок, поэтому там он повторён.
    add_header X-Robots-Tag $ps_robots_tag always;

    # Логи
    access_log /var/log/nginx/perfect-skin.access.log;
    error_log  /var/log/nginx/perfect-skin.error.log;

    # Статика клиента (SPA)
    root /var/www/perfect-skin/client;
    index index.html;

    # Просмотр заявок специалистов по одноразовым ссылкам — не логируем (содержат токены)
    location /api/v1/review/ {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Загруженные фото товаров
    location /uploads/products/ {
        alias /var/www/perfect-skin/uploads/products/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag $ps_robots_tag always;
    }

    # Видеоотзывы (/uploads/video-reviews/ и внутренний /_protected/video-reviews/): сниппет рядом с конфигом.
    # Выкладка на живой сервер — deploy/apply-nginx-media.sh, сам файл целиком в sites-available не перезаписывается.
    include /etc/nginx/snippets/perfect-skin-media.conf;

    # Загрузка видео и постеров из админки: ролик весит до 60 МБ, на загрузку нужно больше времени.
    # Регулярное выражение важнее префикса /api/v1/, поэтому этот блок перехватывает оба адреса.
    location ~ ^/api/v1/admin/video-reviews/[0-9a-f-]+/(media|consent-doc) {
        client_max_body_size 65m;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → Fastify на localhost:3000 (роуты уже с префиксом /api/v1, не срезаем)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, а не $proxy_add_x_forwarded_for: второй дописывает
        # адрес к тому, что прислал клиент, и подделанный заголовок доезжает
        # до сервера. Здесь клиент — всегда сам покупатель, цепочки прокси нет.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Главная и /index.html — через Fastify: он отдаёт шаблон с метой; /index.html редиректит на /
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets: долгий кэш (хешируются в имени)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $ps_robots_tag always;
    }

    # Файлы клиента с диска (favicon, логотипы, фото, снимок каталога); остальные адреса — HTML через Fastify
    location / {
        try_files $uri @seo;
    }

    location @seo {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gzip для текстовых типов
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;
}
