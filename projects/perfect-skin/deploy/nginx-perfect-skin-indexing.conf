# Переключатель индексации Perfect Skin. Один на весь nginx-конфиг.
# Закрыто (сейчас): заголовок X-Robots-Tag с запретом. Открыто: пустая строка — заголовок не отдаётся.
# Менять только вместе с PS_INDEXING=on в server/.env (см. deploy/DEPLOY.md, §4.4).
# Файл подключается на уровне http, поэтому map здесь, а не внутри server-блока.
map $host $ps_robots_tag {
    default "noindex, nofollow, noarchive";
}
