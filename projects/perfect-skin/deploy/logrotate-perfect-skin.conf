# Ротация логов cron-задач Perfect Skin: очистка гостевых корзин и синхронизации.
# Оба процесса пишут в файл через `>> ... 2>&1` из cron и понятия не имеют о
# логротейте — файл им нужен открытым по тому же inode всё время работы.
#
# Поэтому copytruncate, а не стандартный create:
#   create   переименовывает старый файл и заводит новый с тем же именем —
#            но дескриптор, который уже держит открытым cron-процесс,
#            продолжает писать в переименованный (уже отправленный в архив)
#            файл. Новый файл на диске остаётся пустым, потеря логов.
#   copytruncate  копирует текущее содержимое в архив, затем обнуляет
#            («truncate») исходный файл на месте, не трогая inode. Процесс
#            как писал в тот же файл, так и продолжает — коротким кускам
#            между copy и truncate достаточно буфера, потеря нескольких строк
#            на стыке не критична для лога очистки.

/var/log/ps-cleanup.log {
    # На Ubuntu каталог /var/log принадлежит root:syslog и открыт группе на
    # запись. Logrotate считает такой каталог небезопасным и молча пропускает
    # все логи в нём («parent directory has insecure permissions»), пока ему
    # явно не сказано, от чьего имени вращать. Права каталога не трогаем —
    # их держит rsyslog, — а называем ту же пару, что и его собственный конфиг.
    su root syslog
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
