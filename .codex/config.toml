# Project-local Codex configuration. Loaded after the checkout is trusted.
developer_instructions = "Friday: сначала полностью прочитай .codex/CODEX.md. Пользователь — только Гермес. Автоматически выбирай подходящих специалистов, скиллы и проверки; выполняй разрешённую задачу до результата. Собственные заметки храни в .codex/."

[agents]
enabled = true
max_concurrent_threads_per_session = 6
max_depth = 3

[agents."architect"]
description = "Проектирует схему БД и API контракт. Используй когда нужно спроектировать структуру нового проекта, добавить новую фичу на уровне архитектуры, выбрать стек или спланировать мультитенантность и биллинг."
config_file = "agents/architect.toml"

[agents."coder"]
description = "Пишет код по спецификации или описанию задачи. Используй когда нужно реализовать конкретную фичу, компонент, API эндпоинт или модуль — быстро и по правилам проекта."
config_file = "agents/coder.toml"

[agents."debugger"]
description = "Находит причину ошибки и предлагает исправление. Используй когда что-то сломалось, есть непонятный баг, ошибка в консоли или тест падает. Опиши симптом — найду причину."
config_file = "agents/debugger.toml"

[agents."orchestrator"]
description = "Оркестратор процесса — определяет, сколько и каких агентов запустить одновременно, чтобы ускорить работу, запускает их волнами и двигает проект на следующий этап. Используй когда задача крупная («сделай спринт», «доведи фичу», «двигай проект дальше») и нужно, чтобы работа шла сама, а пользователь только проверял результат. Не путать с planner (тот декомпозирует задачу в план, этот исполняет план чужими руками)."
config_file = "agents/orchestrator.toml"

[agents."planner"]
description = "Специалист по планированию — декомпозиция сложных задач, поэтапный план с рисками и критериями успеха. Используй проактивно перед реализацией любой нетривиальной фичи. Это первый шаг перед coder."
config_file = "agents/planner.toml"

[agents."researcher"]
description = "Быстро находит нужный код, понимает архитектуру, трассирует пути исполнения. Используй для любого исследования кодовой базы перед реализацией. Также проводит E2E анализ пользовательских сценариев."
config_file = "agents/researcher.toml"

[agents."brand-guard"]
description = "Проверяет сгенерированные медиа-ассеты (изображения, видео, музыку, озвучку) на соответствие бренд-киту и дизайн-системе проекта. Работает в паре с media-generator — запускается после каждой его задачи. Не путать с design-reviewer: тот про качество вёрстки и UI-кода, этот про сам медиа-ассет."
config_file = "agents/brand-guard.toml"

[agents."component-curator"]
description = "Подбирает готовые React/Tailwind-компоненты, темы и логотипы из каталога 21st.dev и адаптирует их под дизайн-систему проекта. Используй когда нужен конкретный UI-блок (hero, карточка, таблица цен, навигация) как основа, а не иконка (это icon-curator) и не общая оценка UI (это design-reviewer)."
config_file = "agents/component-curator.toml"

[agents."design-department"]
description = "Отдел дизайна и UX — единая точка входа для ЛЮБОГО запроса по интерфейсу (\"проверь UI\", \"аудит дизайна\", \"почему выглядит непрофессионально\", \"пройдись по UX\", \"подбери стиль/палитру\"). Сам решает, каких специалистов подключить, запускает их параллельно и собирает единый отчёт по приоритетам (P1–P10)."
config_file = "agents/design-department.toml"

[agents."design-reviewer"]
description = "Ревью визуального качества UI — типографика, цвет, иерархия, layout, доступность и «AI-slop» анти-паттерны. Используй перед коммитом изменений в UI (.tsx компоненты, страницы, лендинги, письма). Дополняет react-reviewer (тот про хуки/рендеры/XSS, этот про то, как оно выглядит). Стек проекта читай из docs/projects/<проект>/project.md."
config_file = "agents/design-reviewer.toml"

[agents."icon-curator"]
description = "Подбирает статичные SVG- и анимированные Lottie-иконки для проекта через открытые бесплатные источники (Iconify, LottieFiles) и адаптирует под текущий стиль. Используй когда нужна конкретная иконка/анимация для интерфейса, а не готовый файл от пользователя."
config_file = "agents/icon-curator.toml"

[agents."media-generator"]
description = "Генерирует изображения, видео и озвучку для проекта через Artlist (баннеры, карточки товаров, соцсети, короткие ролики, войсовер) и передаёт результат дизайнерам на доводку и встраивание. Используй когда нужен визуальный/аудио медиа-контент для сайта, а не готовый файл от пользователя."
config_file = "agents/media-generator.toml"

[agents."motion-curator"]
description = "Подбирает и встраивает конкретную анимацию интерфейса на движке anime.js через обязательную обёртку моторики проекта — счётчики, появление при скролле, стаггер списка, жесты и таймлайны. Используй когда нужно анимировать конкретный элемент по правилам проекта, а не оценить UI целиком (это design-reviewer) и не подобрать готовую иконку (это icon-curator)."
config_file = "agents/motion-curator.toml"

[agents."taste-curator"]
description = "Подбирает и организует референсы дизайна для библиотеки вкуса Nullume, группирует их в семейства стилей через кластеризацию, заполняет дескрипторы (палитра, типографика, motion, dials) и готовит их к утверждению в дашборде. Не ревьюит готовый UI (это design-reviewer) и не генерирует медиа (это media-generator); куратор референсов, вкусовой навигатор."
config_file = "agents/taste-curator.toml"

[agents."rkn-compliance"]
description = "Проверяет правовую обвязку продукта — согласия на обработку персональных данных, политику, cookie и аналитику, способ авторизации, размещение БД, маркировку рекламы. Используй на этапе архитектуры и ОБЯЗАТЕЛЬНО перед сдачей публичного сайта российскому клиенту. Не путать с security-* агентами: те про техническую защиту, этот про соответствие требованиям."
config_file = "agents/rkn-compliance.toml"

[agents."marketing-agent"]
description = "Маркетолог и копирайтер — тексты для лендингов, email-рассылок, соцсетей, рекламы. Исследует аудиторию, разрабатывает позиционирование, пишет конвертирующие тексты. Используй при создании маркетинговых материалов."
config_file = "agents/marketing-agent.toml"

[agents."seo-department"]
description = "Отдел SEO и GEO/AEO — единая точка входа для ЛЮБОГО запроса по продвижению (\"проверь SEO\", \"почему нас нет в поиске\", \"видит ли нас нейросеть\", \"собери семантику\", \"напиши ТЗ копирайтеру\", \"где упомянуть продукт\"). Сам решает, классическое это SEO или видимость в ИИ-ответах, и подключает нужного специалиста."
config_file = "agents/seo-department.toml"

[agents."seo-specialist"]
description = "Специалист по техническому SEO — мета-теги, Core Web Vitals, структурированные данные, sitemap, robots.txt, crawlability. Используй перед запуском в продакшн или при падении органического трафика. Стек: React SPA + Vite."
config_file = "agents/seo-specialist.toml"

[agents."agent-auditor"]
description = "Аудитор всей системы агентов — проверяет определения в .claude/agents/*, .claude/commands/*, .claude/skills/* на консистентность, пробелы, пересечения ролей, битые ссылки и соответствие CLAUDE.md. Даёт единый отчёт о здоровье «команды». Используй после добавления/изменения агентов или периодически. Отличается от agent-evaluator: тот оценивает КАЧЕСТВО ВЫВОДА одного агента на задаче, а этот — АРХИТЕКТУРУ ВСЕГО РОСТЕРА."
config_file = "agents/agent-auditor.toml"

[agents."agent-evaluator"]
description = "Оценивает качество ответов других агентов по 5 осям. Используй когда нужно проверить насколько хорошо агент выполнил задачу, или для улучшения промптов агентов."
config_file = "agents/agent-evaluator.toml"

[agents."archivarius"]
description = "Архивариус — хранитель памяти между сессиями. Сворачивает сырые записи диалога в связный свод (что решили и почему, что отложено, где споткнулись) и отвечает на вопросы «а что мы решали по теме X» из архива прошлых сессий. Используй в начале работы, когда нужен контекст прошлых сессий, и после крупной работы — чтобы свернуть накопленное."
config_file = "agents/archivarius.toml"

[agents."challenger"]
description = "Оппонент — ищет самый сильный довод против предложенного решения и условия, при которых оно окажется неверным. Используй перед принятием любого решения, которое дорого откатывать: выбор стека, схема БД, способ интеграции, архитектура фичи. Не ревьюер кода: тот ищет баги в написанном, этот возражает против замысла до того, как он написан."
config_file = "agents/challenger.toml"

[agents."strategist"]
description = "Наблюдатель-стратег — следит за ходом работы над проектом и делает креативные выводы «сверху». Не ищет баги построчно (для этого узкие ревьюеры), а замечает большую картину: связи между находками разных агентов, упущенные возможности, product-риски, противоречия между тем, что заявлено, и что реально в коде. Используй после крупного спринта/аудита, когда нужен синтез и свежий взгляд, а не список правок."
config_file = "agents/strategist.toml"

[agents."anthropic-docs"]
description = "Отвечает на вопросы о Claude Code по официальной документации Anthropic. Используй проактивно когда пользователь спрашивает про устройство Claude Code, скиллы, субагентов, MCP, хуки, настройки, команды, разрешения, плагины, или как что-либо работает в Claude Code."
config_file = "agents/anthropic-docs.toml"

[agents."automator"]
description = "Анализирует и автоматизирует бизнес-процессы — скрипты, CI/CD, планировщики задач. Используй когда нужно автоматизировать повторяющуюся задачу или настроить пайплайн."
config_file = "agents/automator.toml"

[agents."devops"]
description = "Настройка CI/CD, деплой, инфраструктура, GitHub Actions. Используй при деплое, настройке сервера или проблемах с инфраструктурой. Конкретный стек см. в docs/projects/<проект>/project.md."
config_file = "agents/devops.toml"

[agents."documenter"]
description = "Пишет документацию — README, описание API, комментарии к сложному коду, changelog. Используй когда нужно задокументировать проект, модуль или публичное API."
config_file = "agents/documenter.toml"

[agents."performance-optimizer"]
description = "Специалист по производительности — bundle size, скорость загрузки, N+1 запросы, ре-рендеры. Используй проактивно при медленных страницах, перед продакшн-деплоем или когда LCP > 2.5 сек. Стек проекта — в его `docs/projects/<проект>/project.md`."
config_file = "agents/performance-optimizer.toml"

[agents."qa-engineer"]
description = "Инженер по тестированию — проектирует тест-планы, пишет и чинит тесты, оценивает покрытие критичных сценариев. Используй когда нужно покрыть фичу тестами, разобрать падающий тест, составить план проверки перед релизом или оценить, что именно не протестировано. Отличается от debugger (тот ищет причину конкретного бага) и от researcher (тот исследует код, а не проверяет его поведение)."
config_file = "agents/qa-engineer.toml"

[agents."refactor-cleaner"]
description = "Специалист по очистке кода — мёртвый код, дублирование, лишние зависимости. Используй проактивно после крупного спринта или перед релизом. Не трогает работающую логику — только убирает лишнее."
config_file = "agents/refactor-cleaner.toml"

[agents."silent-failure-hunter"]
description = "Охотник за тихими ошибками — находит пустые catch-блоки, проглоченные ошибки, плохие fallback-значения, потерянную обработку ошибок. Используй перед релизом или когда в продакшне пропадают ошибки без следа."
config_file = "agents/silent-failure-hunter.toml"

[agents."code-reviewer"]
description = "Проверяет код на безопасность, производительность и качество. Используй перед мержем в main, после крупных изменений или при рефакторинге. Находит реальные проблемы, не придирается к стилю."
config_file = "agents/code-reviewer.toml"

[agents."database-reviewer"]
description = "Специалист по базам данных — оптимизация запросов, схема БД, безопасность, производительность. Используй перед деплоем изменений в БД, при медленных запросах или при проектировании новых таблиц. СУБД и ORM проекта — в его `docs/projects/<проект>/project.md`."
config_file = "agents/database-reviewer.toml"

[agents."migration-guard"]
description = "Отвечает за безопасность миграций БД и выкатку изменений схемы на прод — проверяет обратимость, блокировки таблиц, потерю данных, порядок деплоя код↔схема, наличие бэкапа. Используй ПЕРЕД применением миграции на проде и при ревью изменений schema.prisma. Отличается от database-reviewer: тот про качество схемы и запросов (индексы, N+1), этот про риск самой выкатки."
config_file = "agents/migration-guard.toml"

[agents."react-reviewer"]
description = "Эксперт по React — корректность хуков, производительность рендеров, безопасность, доступность. Используй перед коммитом изменений в .tsx компонентах. Стек проекта: React 18 + Vite + TypeScript + Tailwind."
config_file = "agents/react-reviewer.toml"

[agents."typescript-reviewer"]
description = "Эксперт по TypeScript и JavaScript — типобезопасность, async/await корректность, безопасность, идиоматические паттерны. Используй перед коммитом изменений в TypeScript файлах. Стек проекта — в его `docs/projects/<проект>/project.md`."
config_file = "agents/typescript-reviewer.toml"

[agents."security-api-surface"]
description = "Проверяет внешнюю поверхность приложения — входящие вебхуки и их подписи, серверные запросы по URL от пользователя (SSRF), открытые редиректы, подделку заголовка Host, OAuth и внешние входы, инъекции, загрузку файлов, парсеры, лишние поля и забытые эндпоинты в API. Используй при подключении любой внешней интеграции и перед выкаткой."
config_file = "agents/security-api-surface.toml"

[agents."security-auth-access"]
description = "Проверяет аутентификацию, авторизацию, сессии, токены, защиту от подделки запроса (CSRF) и разграничение доступа между пользователями. Используй при аудите API, ролей и прав, или при подозрении на утечку данных между пользователями."
config_file = "agents/security-auth-access.toml"

[agents."security-business-logic"]
description = "Проверяет бизнес-логику на злоупотребления — подмена цены, повторный купон, двойной возврат, состояние гонки, обход лимитов и шагов процесса. Используй при любых изменениях в платежах, скидках, бонусах, остатках и лимитах. Отличается от security-auth-access — тот про «кто имеет право», этот про «как выкрутить правила, имея право»."
config_file = "agents/security-business-logic.toml"

[agents."security-department"]
description = "Отдел кибербезопасности проекта — единая точка входа для ЛЮБОГО запроса по безопасности (\"проверь на уязвимости\", \"аудит безопасности\", \"нас взломали\", \"проверь секреты в коде\", \"аудит зависимостей\", \"проверь права доступа\" и т.п.). Сам решает, каких специалистов подключить, запускает их и собирает единый отчёт."
config_file = "agents/security-department.toml"

[agents."security-dependency-audit"]
description = "Аудит зависимостей проекта — ищет известные уязвимости (CVE), устаревшие версии и риски supply chain. Используй перед релизом, после добавления новых пакетов или в рамках общего аудита безопасности."
config_file = "agents/security-dependency-audit.toml"

[agents."security-incident-response"]
description = "Помогает разобраться при подозрении на взлом, утечку данных или аномальную активность — сбор фактов, локализация проблемы, план сдерживания. Используй когда что-то уже могло произойти (не для профилактического аудита — для этого есть другие специалисты отдела)."
config_file = "agents/security-incident-response.toml"

[agents."security-infra-cloud"]
description = "Проверяет конфигурацию инфраструктуры и хостинга — переменные окружения, CORS, HTTP-заголовки безопасности, ограничение частоты запросов, доступ к БД и файловому хранилищу, открытые порты. Используй перед продакшн-деплоем или в рамках общего аудита безопасности."
config_file = "agents/security-infra-cloud.toml"

[agents."security-observability"]
description = "Проверяет, способен ли проект заметить атаку и восстановиться после неё — логирование значимых событий, оповещения, следы в логах, резервные копии и проверка восстановления. Используй в рамках общего аудита и перед запуском проекта в продакшн. Отвечает на вопрос «мы вообще узнаем, что нас ломают»."
config_file = "agents/security-observability.toml"

[agents."security-secrets-scanner"]
description = "Ищет утечки секретов — API-ключи, пароли, токены, приватные ключи — в коде, конфигах и истории git. Используй перед коммитом, перед тем как сделать репозиторий публичным, или в рамках общего аудита безопасности."
config_file = "agents/security-secrets-scanner.toml"

[agents."codex-docs"]
description = "Устройство Codex: конфигурация, роли, скиллы, хуки, MCP и проверка совместимости."
config_file = "agents/codex-docs.toml"























[mcp_servers."21st"]
url = "https://21st.dev/api/mcp"
required = false
env_http_headers = { "x-api-key" = "TWENTYFIRST_API_KEY" }

[mcp_servers.icon-library]
command = "bash"
args = ["-lc", "exec python3 \"$(git rev-parse --show-toplevel)/.codex/scripts/mcp-launch.py\" icon-library"]
env_vars = ["LOTTIEFILES_API_KEY"]
required = false

[mcp_servers.nullume]
command = "bash"
args = ["-lc", "exec python3 \"$(git rev-parse --show-toplevel)/.codex/scripts/mcp-launch.py\" nullume"]
env_vars = ["KIE_API_KEY"]
required = false

[plugins."friday-workflows@friday-local"]
enabled = true
